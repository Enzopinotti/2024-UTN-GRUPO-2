name: B28 product persistence characterization

on:
  push:
    branches:
      - modernize/b28-product-persistence-authority-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Characterize persistence ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("Backend/antigal.server")
          repos = root / "Repositories"
          services = root / "Services"

          def read(path):
              return path.read_text(encoding="utf-8-sig")

          product_repo = read(repos / "ProductRepository.cs")
          product_service = read(services / "ProductService.cs")

          repo_save_files = []
          repo_save_total = 0
          for path in sorted(repos.glob("*.cs")):
              src = read(path)
              count = src.count("_context.SaveChangesAsync()")
              if count:
                  repo_save_files.append((path.name, count))
                  repo_save_total += count

          uow_save_files = []
          uow_save_total = 0
          for path in sorted(services.glob("*.cs")):
              src = read(path)
              count = src.count("_unitOfWork.SaveChangesAsync()")
              if count:
                  uow_save_files.append((path.name, count))
                  uow_save_total += count

          print(f"repository-context-save-file-count={len(repo_save_files)}")
          print(f"repository-context-save-call-count={repo_save_total}")
          for name, count in repo_save_files:
              print(f"repository-context-save={count}|{name}")

          print(f"service-unitofwork-save-file-count={len(uow_save_files)}")
          print(f"service-unitofwork-save-call-count={uow_save_total}")
          for name, count in uow_save_files:
              print(f"service-unitofwork-save={count}|{name}")

          product_repo_contracts = {
              "add": "await _context.SaveChangesAsync();" in re.search(
                  r"public async Task<Producto> AddProductAsync\(.*?\n        \}",
                  product_repo, flags=re.S
              ).group(0),
              "update": "await _context.SaveChangesAsync();" in re.search(
                  r"public async Task<bool> UpdateProductAsync\(.*?\n        \}",
                  product_repo, flags=re.S
              ).group(0),
              "delete": "await _context.SaveChangesAsync();" in re.search(
                  r"public async Task<bool> DeleteProductAsync\(.*?\n        \}",
                  product_repo, flags=re.S
              ).group(0),
              "import": "await _context.SaveChangesAsync();" in re.search(
                  r"public async Task<IEnumerable<Producto>> ImportProductsFromExcelAsync\(.*?\n        \}",
                  product_repo, flags=re.S
              ).group(0),
          }
          for op, value in product_repo_contracts.items():
              print(f"product-repository-{op}-self-save={value}")

          for op in ("AddProductAsync", "DeleteProductAsync", "PutProductAsync", "ImportProductsFromExcelAsync"):
              match = re.search(
                  rf"public async Task<ResponseDto> {op}\(.*?\n        \}}",
                  product_service,
                  flags=re.S,
              )
              if not match:
                  raise SystemExit(f"missing ProductService method: {op}")
              method = match.group(0)
              print(
                  f"product-service-{op}-unitofwork-save="
                  f"{'_unitOfWork.SaveChangesAsync()' in method}"
              )

          title_method = re.search(
              r"public async Task<IEnumerable<Producto>> GetProductsByTitleAsync\(.*?\n        \}",
              product_repo, flags=re.S
          ).group(0)
          add_method = re.search(
              r"public async Task<ResponseDto> AddProductAsync\(.*?\n        \}",
              product_service, flags=re.S
          ).group(0)

          title_returns_list = "ToListAsync()" in title_method
          add_null_guard = "if (productoExistente != null)" in add_method
          print(f"product-title-query-returns-list={title_returns_list}")
          print(f"product-add-duplicate-guard-null-check={add_null_guard}")
          print(f"product-add-duplicate-guard-always-true-risk={title_returns_list and add_null_guard}")

          required = {
              "repository add self-save": product_repo_contracts["add"],
              "repository update self-save": product_repo_contracts["update"],
              "repository delete self-save": product_repo_contracts["delete"],
              "repository import self-save": product_repo_contracts["import"],
              "service add second save": "_unitOfWork.SaveChangesAsync()" in re.search(r"public async Task<ResponseDto> AddProductAsync\(.*?\n        \}", product_service, re.S).group(0),
              "service delete second save": "_unitOfWork.SaveChangesAsync()" in re.search(r"public async Task<ResponseDto> DeleteProductAsync\(.*?\n        \}", product_service, re.S).group(0),
              "service update second save": "_unitOfWork.SaveChangesAsync()" in re.search(r"public async Task<ResponseDto> PutProductAsync\(.*?\n        \}", product_service, re.S).group(0),
              "import no second save": "_unitOfWork.SaveChangesAsync()" not in re.search(r"public async Task<ResponseDto> ImportProductsFromExcelAsync\(.*?\n        \}", product_service, re.S).group(0),
          }
          failed=[name for name,ok in required.items() if not ok]
          if failed:
              for name in failed:
                  print(f"FAIL: {name}")
              raise SystemExit(1)
          PY

      - name: Verify checkout remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
