name: B6b unused React imports lab

on:
  push:
    branches:
      - modernize/b6b-unused-react-imports-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b6b-unused-react-imports-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B6b commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Capture B6a lint baseline
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src --format json > "$GITHUB_WORKSPACE/b6b-lint-before.json" || true

      - name: Remove only lint-proven unused React default imports
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const report = JSON.parse(fs.readFileSync("b6b-lint-before.json", "utf8"));
          const targets = new Set();

          for (const item of report) {
            if ((item.messages || []).some(
              (message) =>
                message.ruleId === "no-unused-vars" &&
                message.severity === 1 &&
                /'React' is defined but never used/.test(message.message)
            )) {
              targets.add(item.filePath);
            }
          }

          if (targets.size !== 93) {
            throw new Error(`Expected 93 lint-proven unused React imports, found ${targets.size}`);
          }

          let changed = 0;
          for (const filePath of [...targets].sort()) {
            let source = fs.readFileSync(filePath, "utf8");
            const original = source;

            // Preserve named React imports while removing only the unused default.
            source = source.replace(
              /^import\s+React\s*,\s*\{([\s\S]*?)\}\s*from\s*(["'])react\2\s*;?\s*$/m,
              (_match, named, quote) => `import {${named}} from ${quote}react${quote};`
            );

            // Remove default-only React imports under the automatic JSX runtime.
            source = source.replace(
              /^import\s+React\s+from\s*(["'])react\1\s*;?\s*\n?/m,
              ""
            );

            if (source === original) {
              throw new Error(`Unsupported React import shape in ${path.relative(process.cwd(), filePath)}`);
            }

            fs.writeFileSync(filePath, source);
            changed += 1;
          }

          console.log(`b6b_react_import_targets=${targets.size}`);
          console.log(`b6b_react_import_files_changed=${changed}`);
          NODE

      - name: Validate tightened lint boundary
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src --format json > "$GITHUB_WORKSPACE/b6b-lint-after.json" || true
          cd "$GITHUB_WORKSPACE"

          node - <<'NODE' | tee b6b-summary.txt
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("b6b-lint-after.json", "utf8"));

          let errors = 0;
          let warnings = 0;
          let fatals = 0;
          let unusedReact = 0;
          const rules = new Map();

          for (const item of report) {
            errors += item.errorCount || 0;
            warnings += item.warningCount || 0;
            fatals += item.fatalErrorCount || 0;
            for (const message of item.messages || []) {
              const rule = message.ruleId || "<parser>";
              rules.set(rule, (rules.get(rule) || 0) + 1);
              if (
                rule === "no-unused-vars" &&
                /'React' is defined but never used/.test(message.message)
              ) {
                unusedReact += 1;
              }
            }
          }

          console.log(`lint_errors=${errors}`);
          console.log(`lint_warnings=${warnings}`);
          console.log(`lint_fatal_errors=${fatals}`);
          console.log(`lint_unused_react=${unusedReact}`);
          for (const [rule, count] of [...rules.entries()].sort((a,b)=>b[1]-a[1])) {
            console.log(`rule=${rule} total=${count}`);
          }

          if (errors !== 0 || fatals !== 0) {
            throw new Error("B6b introduced blocking lint failures");
          }
          if (unusedReact !== 0) {
            throw new Error(`B6b left ${unusedReact} unused React default imports`);
          }
          if (warnings > 22) {
            throw new Error(`B6b warning boundary regressed above 22: ${warnings}`);
          }

          console.log("b6b_unused_react_boundary=clean");
          NODE

          cd Frontend/antigal.client
          npm run lint -- --max-warnings 22

      - name: Test frontend behavior
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Validate direct production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security boundary
        run: python3 scripts/security_baseline.py

      - name: Reconfirm zero-advisory package graph
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/b6b-frontend-audit.json" || true
          )
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive > b6b-solution-vulnerable.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("b6b-frontend-audit.json").read_text())
          total = audit.get("metadata", {}).get("vulnerabilities", {}).get("total", 0)
          print(f"frontend_audit_total={total}")
          if total != 0:
              raise SystemExit("frontend dependency graph regressed")

          solution = Path("b6b-solution-vulnerable.txt").read_text()
          if "has the following vulnerable packages" in solution:
              raise SystemExit("NuGet solution vulnerability audit regressed")
          print("nuget_solution_vulnerability_report_clean=true")
          PY

      - name: Commit validated source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/src
          git diff --cached --quiet && { echo "No source cleanup changes"; exit 1; }
          git commit -m "B6b lab candidate: remove unused React imports"
          git push origin HEAD:modernize/b6b-unused-react-imports-lab

      - name: Upload B6b evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b6b-unused-react-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b6b-lint-before.json
            b6b-lint-after.json
            b6b-summary.txt
            b6b-frontend-audit.json
            b6b-solution-vulnerable.txt
