name: B18 Mercado Pago 3 lab

on:
  push:
    branches:
      - modernize/b18-mercadopago3-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b18-mercadopago3-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B18 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.401"

      - name: Verify B18 package and integration authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          grep -Fq 'PackageReference Include="mercadopago-sdk" Version="3.7.0"' Backend/antigal.server/antigal.server.csproj
          grep -Fq 'mercadopago-sdk" Version="3.7.0"' .github/workflows/quality.yml
          grep -Fq 'MercadoPagoConfig.AccessToken = mercadoPagoAccessToken;' Backend/antigal.server/Program.cs
          grep -Fq 'var client = new PreferenceClient();' Backend/antigal.server/Services/PaymentService.cs
          grep -Fq 'new PreferenceRequest' Backend/antigal.server/Services/PaymentService.cs
          test -f Backend/antigal.server.Tests/MercadoPagoSdkCompatibilityTests.cs
          echo "b18_mercadopago_package_authority=3.7.0"
          echo "b18_checkout_pro_surface=guarded"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend maintained authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs
          node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.slnx

      - name: Build backend warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.slnx -c Release --no-restore | tee "$RUNNER_TEMP/b18-backend-build.txt"
          if grep -Eq '\.cs\([0-9]+,[0-9]+\): warning CS[0-9]+:' "$RUNNER_TEMP/b18-backend-build.txt"; then
            echo "B18 introduced compiler warnings" >&2
            exit 1
          fi

      - name: Test backend Mercado Pago compatibility
        shell: bash
        run: |
          set -o pipefail
          dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build | tee "$RUNNER_TEMP/b18-backend-tests.txt"
          grep -Eq 'Passed:[[:space:]]+20' "$RUNNER_TEMP/b18-backend-tests.txt"
          grep -Eq 'Total:[[:space:]]+20' "$RUNNER_TEMP/b18-backend-tests.txt"
          echo "b18_backend_tests=20"

      - name: Verify resolved Mercado Pago graph
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list --project Backend/antigal.server/antigal.server.csproj --include-transitive --no-restore | tee "$RUNNER_TEMP/b18-package-list.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "b18-package-list.txt").read_text()
          top_level, sep, _ = text.partition("Transitive Package")
          if not sep:
              raise SystemExit("dotnet package list did not expose expected sections")

          match = re.search(
              r"mercadopago-sdk\s+3\.7\.0\s+3\.7\.0",
              top_level,
              flags=re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Mercado Pago 3.7.0 is not the resolved top-level authority")

          print("b18_mercadopago_resolved=3.7.0")
          PY

      - name: Verify Mercado Pago package is current
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list --project Backend/antigal.server/antigal.server.csproj --outdated --no-restore | tee "$RUNNER_TEMP/b18-outdated.txt"
          if grep -Ei 'mercadopago-sdk[[:space:]]+3\.7\.0[[:space:]]+3\.7\.0[[:space:]]+[0-9]' "$RUNNER_TEMP/b18-outdated.txt"; then
            echo "Mercado Pago package has a newer stable version than the B18 pin" >&2
            exit 1
          fi
          echo "b18_mercadopago_targeted_outdated=0"

      - name: Audit NuGet security
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list --project Backend/antigal.server.slnx --vulnerable --include-transitive --no-restore | tee "$RUNNER_TEMP/b18-vulnerable.txt"
          if grep -Fq "has the following vulnerable packages" "$RUNNER_TEMP/b18-vulnerable.txt"; then
            echo "B18 dependency graph contains vulnerable NuGet packages" >&2
            exit 1
          fi

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload B18 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b18-mercadopago-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/b18-backend-build.txt
            ${{ runner.temp }}/b18-backend-tests.txt
            ${{ runner.temp }}/b18-package-list.txt
            ${{ runner.temp }}/b18-outdated.txt
            ${{ runner.temp }}/b18-vulnerable.txt
