name: Current-tree security baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-authorship-security-baseline
      - modernize/b32-like-repository-authority-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate current-tree security boundary
        run: python3 scripts/security_baseline.py

      - name: Verify tracked tree remains clean
        run: git diff --exit-code
