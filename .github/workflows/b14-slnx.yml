name: B14 SLNX lab

on:
  push:
    branches:
      - modernize/b14-slnx-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b14-slnx-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B14 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.401"

      - name: Verify SLNX source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          test -f Backend/antigal.server.slnx
          test ! -e Backend/antigal.server.sln

          dotnet sln Backend/antigal.server.slnx list | tee "$RUNNER_TEMP/b14-slnx-list.txt"

          grep -Fq "antigal.server/antigal.server.csproj" "$RUNNER_TEMP/b14-slnx-list.txt"
          grep -Fq "EmailService/EmailService.csproj" "$RUNNER_TEMP/b14-slnx-list.txt"
          grep -Fq "antigal.server.Tests/antigal.server.Tests.csproj" "$RUNNER_TEMP/b14-slnx-list.txt"

          project_count="$(grep -Ec '\.csproj$' "$RUNNER_TEMP/b14-slnx-list.txt")"
          test "$project_count" = "3"
          echo "b14_slnx_projects=$project_count"

      - name: Verify permanent Quality uses SLNX
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'Backend/antigal.server.slnx' .github/workflows/quality.yml)" -ge 3
          if grep -Fq 'Backend/antigal.server.sln' .github/workflows/quality.yml &&
             ! grep -Fq 'Backend/antigal.server.slnx' .github/workflows/quality.yml; then
            echo "Quality still uses legacy SLN" >&2
            exit 1
          fi
          grep -Fq 'dotnet-solution-authority=slnx' .github/workflows/quality.yml
          grep -Fq 'dotnet-legacy-sln-authority=absent' .github/workflows/quality.yml
          echo "b14_permanent_quality_contract=present"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend maintained authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs
          node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore SLNX solution
        run: dotnet restore Backend/antigal.server.slnx

      - name: Build SLNX solution warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.slnx -c Release --no-restore | tee "$RUNNER_TEMP/b14-backend-build.txt"
          if grep -Eq '\.cs\([0-9]+,[0-9]+\): warning CS[0-9]+:' "$RUNNER_TEMP/b14-backend-build.txt"; then
            echo "SLNX build introduced compiler warnings" >&2
            exit 1
          fi

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Audit NuGet security through SLNX
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Backend/antigal.server.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/b14-vulnerable.txt"
          if grep -Fq "has the following vulnerable packages" "$RUNNER_TEMP/b14-vulnerable.txt"; then
            echo "SLNX candidate contains vulnerable NuGet packages" >&2
            exit 1
          fi

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload B14 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b14-slnx-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/b14-slnx-list.txt
            ${{ runner.temp }}/b14-backend-build.txt
            ${{ runner.temp }}/b14-vulnerable.txt
