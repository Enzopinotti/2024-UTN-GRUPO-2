name: B10 Testing Runtime Lab

on:
  push:
    branches:
      - modernize/b10-testing-runtime-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b10-testing-runtime-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B10 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Upgrade Testing Library runtime boundary
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact             @testing-library/react@latest             @testing-library/user-event@latest             @testing-library/dom@latest

      - name: Install exact B10 candidate
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Print B10 toolchain
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm ls             react             react-dom             @testing-library/react             @testing-library/user-event             @testing-library/dom             @testing-library/jest-dom             vitest | tee "$GITHUB_WORKSPACE/b10-toolchain.txt"

      - name: Validate frontend source authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend and reject deprecated act bridge
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/b10-tests.txt"

          if grep -Fq 'ReactDOMTestUtils.act' "$GITHUB_WORKSPACE/b10-tests.txt"; then
            echo "Deprecated react-dom/test-utils act bridge is still present" >&2
            exit 1
          fi

          grep -F 'Test Files' "$GITHUB_WORKSPACE/b10-tests.txt"
          grep -F 'Tests' "$GITHUB_WORKSPACE/b10-tests.txt"

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee "$GITHUB_WORKSPACE/b10-backend-build.txt"
          if grep -Eq '[[:space:]][1-9][0-9]* Warning\(s\)' "$GITHUB_WORKSPACE/b10-backend-build.txt"; then
            echo "Backend warnings regressed" >&2
            exit 1
          fi

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit B10 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --json > "$GITHUB_WORKSPACE/b10-audit-all.json" || true
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b10-audit-production.json" || true
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY' | tee b10-summary.txt
          import json
          from pathlib import Path

          def counts(path):
              data = json.loads(Path(path).read_text())
              return data.get("metadata", {}).get("vulnerabilities", {})

          full = counts("b10-audit-all.json")
          prod = counts("b10-audit-production.json")

          for label, values in (("all", full), ("production", prod)):
              for severity in ("low", "moderate", "high", "critical", "total"):
                  print(f"{label}_{severity}={values.get(severity, 0)}")

          if full.get("total", 0) != 0:
              raise SystemExit("B10 frontend dependency graph is not advisory-free")
          if prod.get("total", 0) != 0:
              raise SystemExit("B10 production dependency graph is not advisory-free")

          print("b10_testing_runtime_security_boundary=accepted")
          PY

      - name: Commit validated B10 package authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/package.json Frontend/antigal.client/package-lock.json
          git diff --cached --quiet && { echo "No B10 package changes"; exit 0; }
          git commit -m "B10 lab: modernize Testing Library runtime authority"
          git push origin HEAD:modernize/b10-testing-runtime-lab

      - name: Upload B10 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b10-testing-runtime-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b10-toolchain.txt
            b10-tests.txt
            b10-backend-build.txt
            b10-summary.txt
            b10-audit-all.json
            b10-audit-production.json
