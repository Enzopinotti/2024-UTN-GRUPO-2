name: B6c derived state lab

on:
  push:
    branches:
      - modernize/b6c-derived-state-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b6c-derived-state-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B6c commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Prove B6c lint boundary
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src --format json > "$GITHUB_WORKSPACE/b6c-lint.json" || true

          node - <<'NODE' | tee "$GITHUB_WORKSPACE/b6c-summary.txt"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/b6c-lint.json", "utf8"));
          const messages = report.flatMap((file) => file.messages || []);
          const errors = messages.filter((m) => m.severity === 2);
          const warnings = messages.filter((m) => m.severity === 1);

          console.log("b6c_lint_errors=" + errors.length);
          console.log("b6c_lint_warnings=" + warnings.length);

          const expected = {
            "react-hooks/set-state-in-effect": 4,
            "react-hooks/exhaustive-deps": 3,
            "react-hooks/incompatible-library": 2,
          };

          for (const [rule, count] of Object.entries(expected)) {
            const actual = warnings.filter((m) => m.ruleId === rule).length;
            console.log(`b6c_${rule.replaceAll("/", "_")}=${actual}`);
            if (actual !== count) {
              throw new Error(`B6c expected ${count} ${rule} warnings, got ${actual}`);
            }
          }

          if (errors.length !== 0) throw new Error(`B6c has ${errors.length} lint errors`);
          if (warnings.length !== 9) throw new Error(`B6c expected 9 warnings, got ${warnings.length}`);
          if (warnings.some((m) => m.ruleId === "no-unused-vars")) {
            throw new Error("B6c regressed no-unused-vars");
          }

          console.log("b6c_derived_state_boundary=accepted");
          NODE

          npm run lint -- --max-warnings 9

      - name: Validate direct production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Test frontend behavior
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit dependency graph
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/b6c-audit.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b6c-production-audit.json" || true
          )
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive > b6c-nuget-vulnerable.txt

          node - <<'NODE'
          const fs = require("fs");
          for (const file of ["b6c-audit.json", "b6c-production-audit.json"]) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            const v = data.metadata?.vulnerabilities || {};
            if ((v.total || 0) !== 0) throw new Error(`${file} has ${v.total} advisories`);
          }
          const nuget = fs.readFileSync("b6c-nuget-vulnerable.txt", "utf8");
          if (nuget.includes("has the following vulnerable packages")) {
            throw new Error("B6c NuGet graph is not clean");
          }
          console.log("b6c_dependency_audits=clean");
          NODE

      - name: Upload B6c evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b6c-derived-state-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b6c-lint.json
            b6c-summary.txt
            b6c-audit.json
            b6c-production-audit.json
            b6c-nuget-vulnerable.txt
