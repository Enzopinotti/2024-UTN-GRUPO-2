name: B25 backend DI inventory

on:
  push:
    branches:
      - modernize/b25-backend-di-inventory-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Inventory explicit backend registrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path("Backend/antigal.server")
          program = root / "Program.cs"
          text = program.read_text(encoding="utf-8-sig")

          pair_re = re.compile(
              r"builder\.Services\.Add(?P<life>Scoped|Transient|Singleton)"
              r"<\s*(?P<service>[A-Za-z_][A-Za-z0-9_.]*)\s*,\s*"
              r"(?P<impl>[A-Za-z_][A-Za-z0-9_.]*)\s*>\s*\(\s*\)\s*;"
          )
          single_re = re.compile(
              r"builder\.Services\.Add(?P<life>Scoped|Transient|Singleton)"
              r"<\s*(?P<service>[A-Za-z_][A-Za-z0-9_.]*)\s*>\s*\(\s*\)\s*;"
          )

          registrations = []
          occupied = []
          for m in pair_re.finditer(text):
              registrations.append(
                  {
                      "kind": "pair",
                      "life": m.group("life"),
                      "service": m.group("service").split(".")[-1],
                      "impl": m.group("impl").split(".")[-1],
                  }
              )
              occupied.append(m.span())

          def overlaps(span):
              return any(not (span[1] <= a or span[0] >= b) for a, b in occupied)

          for m in single_re.finditer(text):
              if overlaps(m.span()):
                  continue
              registrations.append(
                  {
                      "kind": "single",
                      "life": m.group("life"),
                      "service": m.group("service").split(".")[-1],
                      "impl": m.group("service").split(".")[-1],
                  }
              )

          cs_files = [
              p for p in sorted(root.rglob("*.cs"))
              if not any(part in {"bin", "obj"} for part in p.parts)
          ]

          sources = {
              p: p.read_text(encoding="utf-8-sig")
              for p in cs_files
          }

          def declaration_files(type_name: str) -> set[Path]:
              pat = re.compile(
                  rf"\b(?:class|interface|record|struct)\s+{re.escape(type_name)}\b"
              )
              return {p for p, src in sources.items() if pat.search(src)}

          def reference_files(type_name: str, excluded: set[Path]) -> set[Path]:
              pat = re.compile(rf"\b{re.escape(type_name)}\b")
              return {
                  p for p, src in sources.items()
                  if p not in excluded and pat.search(src)
              }

          def likely_di_consumer_files(type_name: str, excluded: set[Path]) -> set[Path]:
              patterns = [
                  re.compile(rf"\b(?:private|protected|public|internal)\s+(?:readonly\s+)?{re.escape(type_name)}\s+_[A-Za-z0-9_]+"),
                  re.compile(rf"[\(,]\s*{re.escape(type_name)}\s+[A-Za-z_][A-Za-z0-9_]*\s*(?:[,\)])"),
                  re.compile(rf"GetRequiredService\s*<\s*{re.escape(type_name)}\s*>"),
                  re.compile(rf"GetService\s*<\s*{re.escape(type_name)}\s*>"),
                  re.compile(rf"\[FromServices\]\s*{re.escape(type_name)}\b"),
              ]
              return {
                  p for p, src in sources.items()
                  if p not in excluded and any(pat.search(src) for pat in patterns)
              }

          print(f"registration-count={len(registrations)}")
          print("registration|lifetime|service|implementation|service-consumers|implementation-consumers|service-refs|implementation-refs")

          zero_consumer = []
          for reg in registrations:
              service = reg["service"]
              impl = reg["impl"]
              excluded_service = {program} | declaration_files(service)
              excluded_impl = {program} | declaration_files(impl)

              svc_consumers = likely_di_consumer_files(service, excluded_service)
              impl_consumers = likely_di_consumer_files(impl, excluded_impl)
              svc_refs = reference_files(service, excluded_service)
              impl_refs = reference_files(impl, excluded_impl)

              print(
                  "registration|"
                  f"{reg['life']}|{service}|{impl}|"
                  f"{len(svc_consumers)}|{len(impl_consumers)}|"
                  f"{len(svc_refs)}|{len(impl_refs)}"
              )

              for label, files in (
                  ("service-consumer", svc_consumers),
                  ("implementation-consumer", impl_consumers),
                  ("service-ref", svc_refs),
                  ("implementation-ref", impl_refs),
              ):
                  for path in sorted(files):
                      print(
                          f"{label}|{service}|{impl}|"
                          f"{path.as_posix()}"
                      )

              if reg["kind"] == "pair":
                  if not svc_consumers:
                      zero_consumer.append(
                          (reg["life"], service, impl, "pair-service-no-di-consumer")
                      )
              else:
                  if not svc_consumers:
                      zero_consumer.append(
                          (reg["life"], service, impl, "single-no-di-consumer")
                      )

          print(f"zero-di-consumer-registration-count={len(zero_consumer)}")
          for life, service, impl, reason in zero_consumer:
              print(f"zero-di-consumer|{life}|{service}|{impl}|{reason}")
          PY

      - name: Verify characterization checkout is clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
