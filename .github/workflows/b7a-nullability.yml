name: B7a Product filter nullability lab

on:
  push:
    branches:
      - modernize/b7a-product-filter-nullability-lab
  workflow_dispatch:

concurrency:
  group: b7a-product-filter-nullability-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend and capture nullable warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee backend-build.txt

      - name: Verify B7a nullable-warning boundary
        shell: bash
        run: |
          python3 - <<'PY' | tee b7a-nullability-summary.txt
          import re
          from pathlib import Path

          lines = Path("backend-build.txt").read_text().splitlines()
          pattern = re.compile(
              r"(?P<path>[^\s:]+\.cs)\((?P<line>\d+),(?P<col>\d+)\): warning (?P<code>CS\d+):"
          )

          unique = {}
          for line in lines:
              match = pattern.search(line)
              if not match:
                  continue
              key = (
                  match.group("path"),
                  int(match.group("line")),
                  int(match.group("col")),
                  match.group("code"),
              )
              unique[key] = line

          counts = {}
          for *_, code in unique:
              counts[code] = counts.get(code, 0) + 1

          print(f"unique_backend_warnings={len(unique)}")
          for code in sorted(counts):
              print(f"{code}={counts[code]}")

          forbidden = {"CS8625", "CS8604"}
          remaining_forbidden = {code: counts[code] for code in forbidden if counts.get(code)}
          if remaining_forbidden:
              raise SystemExit(f"B7a nullable filter warnings remain: {remaining_forbidden}")

          unexpected = set(counts) - {"CS8618"}
          if unexpected:
              raise SystemExit(f"Unexpected backend warning codes: {sorted(unexpected)}")

          if counts.get("CS8618", 0) != 11 or len(unique) != 11:
              raise SystemExit(
                  f"Expected exactly 11 remaining CS8618 model warnings, got {counts} / {len(unique)} unique"
              )

          print("b7a_product_filter_nullability=accepted")
          PY

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/frontend-audit.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/frontend-production-audit.json" || true
          )
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive > solution-vulnerable.txt

          python3 - <<'PY' | tee b7a-security-summary.txt
          import json
          from pathlib import Path

          full = json.loads(Path("frontend-audit.json").read_text()).get("metadata", {}).get("vulnerabilities", {})
          prod = json.loads(Path("frontend-production-audit.json").read_text()).get("metadata", {}).get("vulnerabilities", {})

          print(f"frontend_audit_total={full.get('total', 0)}")
          print(f"frontend_production_audit_total={prod.get('total', 0)}")

          if full.get("total", 0) != 0 or prod.get("total", 0) != 0:
              raise SystemExit("Frontend dependency graph is no longer clean")

          solution = Path("solution-vulnerable.txt").read_text()
          if "has the following vulnerable packages" in solution:
              raise SystemExit("NuGet solution vulnerability audit is no longer clean")

          print("nuget_solution_vulnerability_report_clean=true")
          PY

      - name: Verify repository remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload B7a evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b7a-nullability-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend-build.txt
            b7a-nullability-summary.txt
            b7a-security-summary.txt
            frontend-audit.json
            frontend-production-audit.json
            solution-vulnerable.txt
