name: B3 security runtime lab

on:
  push:
    branches:
      - modernize/b3-security-runtime-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout exact lab SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Capture runtime
        run: |
          node --version
          npm --version
          dotnet --version
          dotnet --info

      - name: Install frontend
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "false"
        run: npm run build

      - name: Restore .NET 10 solution
        run: dotnet restore Backend/antigal.server.sln

      - name: Build .NET 10 solution
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test .NET 10 behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate security boundary
        run: python3 scripts/security_baseline.py

      - name: Verify clean source tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Audit full .NET solution
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/b3-solution-vulnerable.txt"
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive | tee "$report"

          if grep -q "has the following vulnerable packages" "$report"; then
            echo "solution_vulnerabilities_remaining=true"
            exit 1
          fi

          echo "solution_vulnerabilities_remaining=false"

      - name: Capture direct outdated packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Backend/antigal.server/antigal.server.csproj package --outdated || true
