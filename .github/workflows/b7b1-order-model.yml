name: B7b1 Order model authority lab

on:
  push:
    branches:
      - modernize/b7b1-order-model-authority-lab
  workflow_dispatch:

concurrency:
  group: b7b1-order-model-authority-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Verify order model authority
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Backend/antigal.server/Models/Order.cs
          test ! -e Backend/antigal.server/Models/OrderItem.cs
          test ! -e Backend/antigal.server/Models/Dto/OrderDto.cs
          test -f Backend/antigal.server/Models/Orden.cs
          test -f Backend/antigal.server/Models/OrdenDetalle.cs
          test -f Backend/antigal.server/Models/Dto/OrdenDto.cs
          echo "order-model-authority=spanish-domain"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend and capture warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee backend-build.txt

      - name: Verify B7b1 compiler boundary
        shell: bash
        run: |
          python3 - <<'PY' | tee b7b1-warning-summary.txt
          import re
          from pathlib import Path

          lines = Path("backend-build.txt").read_text().splitlines()
          pattern = re.compile(
              r"(?P<path>[^\s:]+\.cs)\((?P<line>\d+),(?P<col>\d+)\): warning (?P<code>CS\d+):"
          )

          unique = {}
          for line in lines:
              match = pattern.search(line)
              if not match:
                  continue
              key = (
                  match.group("path"),
                  int(match.group("line")),
                  int(match.group("col")),
                  match.group("code"),
              )
              unique[key] = line

          counts = {}
          files = {}
          for path, _line, _col, code in unique:
              counts[code] = counts.get(code, 0) + 1
              name = Path(path).name
              files[name] = files.get(name, 0) + 1

          print(f"unique_backend_warnings={len(unique)}")
          for code in sorted(counts):
              print(f"{code}={counts[code]}")
          for name in sorted(files):
              print(f"{name}={files[name]}")

          if counts != {"CS8618": 6}:
              raise SystemExit(f"Expected only 6 CS8618 warnings, got {counts}")
          if files != {"Contacto.cs": 4, "Envio.cs": 2}:
              raise SystemExit(f"Unexpected warning file boundary: {files}")

          print("b7b1_order_model_authority=accepted")
          PY

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/frontend-audit.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/frontend-production-audit.json" || true
          )
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive > solution-vulnerable.txt

          python3 - <<'PY' | tee b7b1-security-summary.txt
          import json
          from pathlib import Path

          full = json.loads(Path("frontend-audit.json").read_text()).get("metadata", {}).get("vulnerabilities", {})
          prod = json.loads(Path("frontend-production-audit.json").read_text()).get("metadata", {}).get("vulnerabilities", {})
          if full.get("total", 0) != 0 or prod.get("total", 0) != 0:
              raise SystemExit("Frontend dependency graph is no longer clean")

          solution = Path("solution-vulnerable.txt").read_text()
          if "has the following vulnerable packages" in solution:
              raise SystemExit("NuGet solution vulnerability audit is no longer clean")

          print("frontend_audit_total=0")
          print("frontend_production_audit_total=0")
          print("nuget_solution_vulnerability_report_clean=true")
          PY

      - name: Verify tracked repository remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload B7b1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b7b1-order-model-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend-build.txt
            b7b1-warning-summary.txt
            b7b1-security-summary.txt
            frontend-audit.json
            frontend-production-audit.json
            solution-vulnerable.txt
