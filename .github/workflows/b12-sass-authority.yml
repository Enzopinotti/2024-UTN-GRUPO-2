name: B12 Native Sass authority lab

on:
  push:
    branches:
      - modernize/b12-sass-authority-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b12-sass-authority-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B12 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Reconcile package lock after watcher retirement
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Validate permanent frontend authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs
          node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/frontend-tests.txt"

      - name: Build frontend from native Sass
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.txt"

      - name: Verify native Sass bundle boundary
        shell: bash
        run: |
          python3 - <<'PY' | tee "$RUNNER_TEMP/b12-style-summary.txt"
          import os
          from pathlib import Path

          build_log = (Path(os.environ["RUNNER_TEMP"]) / "frontend-build.txt").read_text()
          assets = Path("Frontend/antigal.client/build/assets")
          entry_css = sorted(assets.glob("index-*.css"))

          if len(entry_css) != 1:
              raise SystemExit(f"expected one entry stylesheet, found {len(entry_css)}")

          css_kib = entry_css[0].stat().st_size / 1024
          sass_deprecations = build_log.lower().count("deprecation warning")
          chunk_warnings = build_log.count("Some chunks are larger than 500 kB")
          eval_warnings = build_log.count("[EVAL]")

          print(f"frontend_entry_css_kib={css_kib:.2f}")
          print(f"frontend_sass_deprecation_warnings={sass_deprecations}")
          print(f"frontend_chunk_size_warnings={chunk_warnings}")
          print(f"frontend_direct_eval_warnings={eval_warnings}")

          if not 145 <= css_kib <= 156:
              raise SystemExit(
                  "native Sass bundle escaped validated B11 CSS envelope "
                  f"(145-156 KiB): {css_kib:.2f}"
              )
          if chunk_warnings:
              raise SystemExit("frontend build regained >500 kB chunk warnings")
          if eval_warnings:
              raise SystemExit("frontend build regained direct eval warnings")

          print("b12_native_sass_bundle_boundary=accepted")
          PY

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee "$RUNNER_TEMP/backend-build.txt"

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/b12-audit-all.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b12-audit-production.json" || true
          )
          python3 - <<'PY' | tee "$RUNNER_TEMP/b12-audit-summary.txt"
          import json
          from pathlib import Path

          for label, path in (
              ("all", "b12-audit-all.json"),
              ("production", "b12-audit-production.json"),
          ):
              data = json.loads(Path(path).read_text())
              vulns = data.get("metadata", {}).get("vulnerabilities", {})
              total = vulns.get("total", 0)
              print(f"{label}_total={total}")
              print(f"{label}_high={vulns.get('high', 0)}")
              print(f"{label}_critical={vulns.get('critical', 0)}")
              if total != 0:
                  raise SystemExit(f"{label} npm graph regained advisories: {total}")

          print("b12_dependency_security_boundary=accepted")
          PY

      - name: Commit reconciled lock authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes"; exit 0; }
          git commit -m "B12 lab: reconcile lock after Sass watcher retirement"
          git push origin HEAD:modernize/b12-sass-authority-lab

      - name: Upload B12 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b12-sass-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/frontend-tests.txt
            ${{ runner.temp }}/frontend-build.txt
            ${{ runner.temp }}/b12-style-summary.txt
            ${{ runner.temp }}/backend-build.txt
            ${{ runner.temp }}/b12-audit-summary.txt
            b12-audit-all.json
            b12-audit-production.json
