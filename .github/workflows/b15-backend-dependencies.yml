name: B15 backend dependency refresh lab

on:
  push:
    branches:
      - modernize/b15-backend-dependencies-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b15-backend-dependencies-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B15 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.401"

      - name: Verify B15 direct package authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          grep -Fq 'CloudinaryDotNet" Version="1.29.3"' Backend/antigal.server/antigal.server.csproj
          grep -Fq 'NPOI" Version="2.8.0"' Backend/antigal.server/antigal.server.csproj
          grep -Fq 'MimeKit" Version="4.18.1"' Backend/EmailService/EmailService.csproj
          grep -Fq 'backend-cloudinary=1.29.3' .github/workflows/quality.yml
          grep -Fq 'backend-npoi=2.8.0' .github/workflows/quality.yml
          grep -Fq 'email-mimekit=4.18.1' .github/workflows/quality.yml
          grep -Fq 'dotnet package list --project Backend/antigal.server.slnx --vulnerable --include-transitive --no-restore' .github/workflows/quality.yml
          echo "b15_direct_package_authority=present"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend maintained authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs
          node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.slnx

      - name: Build backend warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.slnx -c Release --no-restore | tee "$RUNNER_TEMP/b15-backend-build.txt"
          if grep -Eq '\.cs\([0-9]+,[0-9]+\): warning CS[0-9]+:' "$RUNNER_TEMP/b15-backend-build.txt"; then
            echo "B15 introduced compiler warnings" >&2
            exit 1
          fi

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Audit NuGet security with noun-first CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list             --project Backend/antigal.server.slnx             --vulnerable             --include-transitive             --no-restore | tee "$RUNNER_TEMP/b15-vulnerable.txt"

          if grep -Fq "has the following vulnerable packages" "$RUNNER_TEMP/b15-vulnerable.txt"; then
            echo "B15 dependency graph contains vulnerable NuGet packages" >&2
            exit 1
          fi

      - name: Verify refreshed packages are current
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list             --project Backend/antigal.server.slnx             --outdated             --no-restore | tee "$RUNNER_TEMP/b15-outdated.txt"

          for package in CloudinaryDotNet NPOI MimeKit; do
            if grep -Eq "^[[:space:]]*>[[:space:]]+$package[[:space:]]" "$RUNNER_TEMP/b15-outdated.txt"; then
              echo "$package is still outdated after B15 refresh" >&2
              exit 1
            fi
          done

          echo "b15_targeted_outdated_packages=0"

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload B15 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b15-backend-dependencies-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/b15-backend-build.txt
            ${{ runner.temp }}/b15-vulnerable.txt
            ${{ runner.temp }}/b15-outdated.txt
