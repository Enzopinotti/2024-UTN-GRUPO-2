name: B4c React Router 7 lab

on:
  push:
    branches:
      - modernize/b4c-router7-lab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout exact lab commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: modernize/b4c-router7-lab

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Resolve Router 7 lockfile
        working-directory: Frontend/antigal.client
        run: npm install --package-lock-only

      - name: Install exact Router 7 candidate
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Verify installed router versions
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm ls react-router-dom react-router | tee "$GITHUB_WORKSPACE/b4c-router-tree.txt"

      - name: Probe frontend behavior and routing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd Frontend/antigal.client
            CI=true npm test -- --watchAll=false
          ) > b4c-tests.txt 2>&1
          code=$?
          set -e
          echo "router7_test_exit=$code" | tee b4c-test-status.txt
          grep -E "Test Suites:|Tests:|Cannot find module|FAIL " b4c-tests.txt | head -n 80 || true

      - name: Probe frontend build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd Frontend/antigal.client
            npm run build
          ) > b4c-build.txt 2>&1
          code=$?
          set -e
          echo "router7_build_exit=$code" | tee b4c-build-status.txt
          grep -E "Compiled successfully|Failed to compile|Module not found|Cannot find|Error" b4c-build.txt | head -n 80 || true

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security boundary
        run: python3 scripts/security_baseline.py

      - name: Audit Router 7 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --json > "$GITHUB_WORKSPACE/b4c-audit-all.json" || true
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b4c-audit-production.json" || true
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY' | tee b4c-summary.txt
          import json
          from pathlib import Path

          def get(path):
              data = json.loads(Path(path).read_text())
              return data.get("metadata", {}).get("vulnerabilities", {})

          all_counts = get("b4c-audit-all.json")
          prod_counts = get("b4c-audit-production.json")

          for label, counts in (("all", all_counts), ("production", prod_counts)):
              for severity in ("low", "moderate", "high", "critical", "total"):
                  print(f"{label}_{severity}={counts.get(severity, 0)}")

          print("router7_production_audit_total=" + str(prod_counts.get("total", 0)))
          print("router7_production_audit_clean=" + str(prod_counts.get("total", 0) == 0).lower())
          PY

      - name: Write Router 7 compatibility summary
        shell: bash
        run: |
          set -euo pipefail
          {
            cat b4c-test-status.txt
            cat b4c-build-status.txt
            cat b4c-summary.txt
          } | tee b4c-compatibility.txt

      - name: Upload Router 7 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4c-router7-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b4c-router-tree.txt
            b4c-summary.txt
            b4c-compatibility.txt
            b4c-test-status.txt
            b4c-build-status.txt
            b4c-tests.txt
            b4c-build.txt
            b4c-audit-all.json
            b4c-audit-production.json
