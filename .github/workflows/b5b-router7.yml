name: B5b React Router 7 lab

on:
  push:
    branches:
      - modernize/b5b-router7-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b5b-router7-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B5b commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Set React Router 7 package authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = "Frontend/antigal.client/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.dependencies["react-router-dom"] = "7.18.4";
          pkg.dependencies = Object.fromEntries(Object.entries(pkg.dependencies).sort());
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cd Frontend/antigal.client
          npm install --package-lock-only

      - name: Install exact Router 7 candidate
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Verify installed Router 7 versions
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm ls react-router-dom react-router | tee "$GITHUB_WORKSPACE/b5b-router-tree.txt"
          node - <<'NODE'
          const dom = require("./node_modules/react-router-dom/package.json");
          const core = require("./node_modules/react-router/package.json");
          if (dom.version !== "7.18.4" || core.version !== "7.18.4") {
            throw new Error(`unexpected Router 7 versions: dom=${dom.version}, core=${core.version}`);
          }
          NODE

      - name: Test all frontend contracts
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Require clean Router 7 npm audit
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --json > "$GITHUB_WORKSPACE/b5b-audit-all.json" || true
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b5b-audit-production.json" || true
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY' | tee b5b-summary.txt
          import json
          from pathlib import Path

          def counts(path):
              data = json.loads(Path(path).read_text())
              return data.get("metadata", {}).get("vulnerabilities", {})

          full = counts("b5b-audit-all.json")
          prod = counts("b5b-audit-production.json")

          for label, values in (("all", full), ("production", prod)):
              for severity in ("low", "moderate", "high", "critical", "total"):
                  print(f"{label}_{severity}={values.get(severity, 0)}")

          if full.get("total", 0) != 0:
              raise SystemExit("Router 7 candidate still has npm audit findings")
          if prod.get("total", 0) != 0:
              raise SystemExit("Router 7 production graph is not clean")

          print("b5b_router7_audit=clean")
          PY

      - name: Commit validated Router 7 authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/package.json Frontend/antigal.client/package-lock.json
          git diff --cached --quiet && { echo "No Router 7 package changes"; exit 0; }
          git commit -m "B5b lab candidate: React Router 7.18.4"
          git push origin HEAD:modernize/b5b-router7-lab

      - name: Upload B5b evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b5b-router7-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b5b-router-tree.txt
            b5b-summary.txt
            b5b-audit-all.json
            b5b-audit-production.json
