name: B5a Vite Vitest lab

on:
  push:
    branches:
      - modernize/b5a-vite-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b5a-vite-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B5a commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Replace CRA package authority with Vite and Vitest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = "Frontend/antigal.client/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

          pkg.dependencies["prop-types"] = "15.8.1";

          pkg.scripts.start = "vite";
          pkg.scripts.build = "vite build";
          pkg.scripts.test = "vitest run";
          pkg.scripts.sass = "sass --no-charset --watch src/styles/scss:src/styles/css";
          pkg.scripts.dev = 'concurrently "npm run sass" "vite"';
          delete pkg.scripts.eject;
          delete pkg.eslintConfig;

          // The product source imports PropTypes directly in maintained
          // components. CRA's transitive graph previously masked this missing
          // runtime authority; Vite/Rolldown correctly requires it explicitly.
          pkg.dependencies["prop-types"] = "15.8.1";

          const removeDev = [
            "@babel/plugin-proposal-private-property-in-object",
            "@eslint/object-schema",
            "@rollup/plugin-terser",
            "@svgr/webpack",
            "css-minimizer-webpack-plugin",
            "eslint",
            "eslint-config-react-app",
            "html-webpack-plugin",
            "react-scripts",
            "rimraf",
            "webpack-dev-server"
          ];

          for (const name of removeDev) {
            delete pkg.devDependencies[name];
          }

          pkg.dependencies = Object.fromEntries(Object.entries(pkg.dependencies).sort());
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies).sort());
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cd Frontend/antigal.client

          # The old lockfile still encodes CRA/Babel peer edges. Re-resolving that
          # mixed graph is what caused the first B5a ERESOLVE. Build a new lock
          # from the cleaned manifest instead of forcing incompatible peers.
          cp package-lock.json "$GITHUB_WORKSPACE/b5a-package-lock-cra.json"
          rm package-lock.json

          npm install --save-exact prop-types@15.8.1

          npm install --save-dev --save-exact \
            vite@8.2.2 \
            @vitejs/plugin-react@6.1.1 \
            vitest@5.0.1 \
            jsdom@30.0.1 \
            @testing-library/jest-dom@7.0.1

          # Apply only compatible lockfile fixes. Remaining advisories are measured
          # explicitly later and are never hidden with --force/--legacy-peer-deps.
          npm audit fix --package-lock-only || true

      - name: Install exact Vite candidate
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate direct production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Verify CRA is absent from package authority
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const forbidden = [
            "react-scripts",
            "eslint-config-react-app",
            "webpack-dev-server",
            "html-webpack-plugin",
            "@svgr/webpack",
            "css-minimizer-webpack-plugin"
          ];
          const remaining = forbidden.filter(
            (name) => pkg.dependencies?.[name] || pkg.devDependencies?.[name]
          );
          if (remaining.length) {
            throw new Error(`CRA package authority still contains: ${remaining.join(", ")}`);
          }
          NODE

          if grep -Eq '"(react-scripts|eslint-config-react-app)"[[:space:]]*:' package-lock.json; then
            echo "CRA packages remain in the regenerated lockfile" >&2
            exit 1
          fi

      - name: Print maintained toolchain
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm ls \
            vite \
            @vitejs/plugin-react \
            vitest \
            jsdom \
            @testing-library/jest-dom \
            react-router-dom | tee "$GITHUB_WORKSPACE/b5a-toolchain.txt"

      - name: Test frontend contracts
        working-directory: Frontend/antigal.client
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit Vite candidate
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --json > "$GITHUB_WORKSPACE/b5a-audit-all.json" || true
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b5a-audit-production.json" || true
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY' | tee b5a-summary.txt
          import json
          from pathlib import Path

          def counts(path):
              data = json.loads(Path(path).read_text())
              return data.get("metadata", {}).get("vulnerabilities", {})

          full = counts("b5a-audit-all.json")
          prod = counts("b5a-audit-production.json")

          for label, values in (("all", full), ("production", prod)):
              for severity in ("low", "moderate", "high", "critical", "total"):
                  print(f"{label}_{severity}={values.get(severity, 0)}")

          if prod.get("high", 0) != 0 or prod.get("critical", 0) != 0:
              raise SystemExit("Vite candidate regressed production high/critical boundary")
          if prod.get("total", 0) > 2:
              raise SystemExit("Vite candidate regressed production advisory count")
          if full.get("critical", 0) != 0:
              raise SystemExit("Vite candidate introduced critical dev/tooling advisories")

          print("b5a_vite_security_boundary=accepted")
          PY

      - name: Commit validated package authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/package.json Frontend/antigal.client/package-lock.json
          git diff --cached --quiet && { echo "No package authority changes"; exit 0; }
          git commit -m "B5a lab candidate: Vite and Vitest package authority"
          git push origin HEAD:modernize/b5a-vite-lab

      - name: Upload B5a evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b5a-vite-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b5a-toolchain.txt
            b5a-summary.txt
            b5a-audit-all.json
            b5a-audit-production.json
            b5a-package-lock-cra.json
