name: B16 FluentValidation 12 lab

on:
  push:
    branches:
      - modernize/b16-fluentvalidation12-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b16-fluentvalidation12-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B16 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.401"

      - name: Verify B16 package authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          grep -Fq 'FluentValidation.DependencyInjectionExtensions" Version="12.1.1"' Backend/antigal.server/antigal.server.csproj
          grep -Fq 'SharpGrip.FluentValidation.AutoValidation.Mvc" Version="2.0.0"' Backend/antigal.server/antigal.server.csproj
          grep -Fq 'backend-fluentvalidation-di=12.1.1' .github/workflows/quality.yml
          grep -Fq 'backend-sharpgrip-autovalidation=2.0.0' .github/workflows/quality.yml
          grep -Fq 'ValidationServices_AssemblyRegistration_ResolvesMaintainedValidators' Backend/antigal.server.Tests/ValidatorTests.cs
          grep -Fq 'ValidationServices_SharpGripAutoValidation_RegistersWithMvc' Backend/antigal.server.Tests/ValidatorTests.cs
          echo "b16_validation_package_authority=present"

      - name: Reject FluentValidation 12 removed APIs
        shell: bash
        run: |
          set -euo pipefail
          patterns='Transform\(|TransformForEach\(|InjectValidator\(|StopOnFirstFailure|EnsureInstanceNotNull|ShouldHaveAnyValidationError|ShouldNotHaveAnyValidationErrors'
          if grep -R -n -E "$patterns" Backend/antigal.server Backend/antigal.server.Tests             --include='*.cs'; then
            echo "Removed FluentValidation 12 API usage found" >&2
            exit 1
          fi
          echo "b16_removed_fluentvalidation_apis=absent"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate frontend maintained authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs
          node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        run: npm run build

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.slnx

      - name: Build backend warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.slnx -c Release --no-restore | tee "$RUNNER_TEMP/b16-backend-build.txt"
          if grep -Eq '\.cs\([0-9]+,[0-9]+\): warning CS[0-9]+:' "$RUNNER_TEMP/b16-backend-build.txt"; then
            echo "B16 introduced compiler warnings" >&2
            exit 1
          fi

      - name: Test backend validation behavior
        shell: bash
        run: |
          set -o pipefail
          dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj             -c Release             --no-build | tee "$RUNNER_TEMP/b16-backend-tests.txt"
          grep -Eq 'Passed:[[:space:]]+18' "$RUNNER_TEMP/b16-backend-tests.txt"
          grep -Eq 'Total:[[:space:]]+18' "$RUNNER_TEMP/b16-backend-tests.txt"
          echo "b16_backend_tests=18"

      - name: Verify resolved validation graph
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list             --project Backend/antigal.server/antigal.server.csproj             --include-transitive             --no-restore | tee "$RUNNER_TEMP/b16-package-list.txt"

          grep -Eq 'FluentValidation.DependencyInjectionExtensions[[:space:]]+12\.1\.1' "$RUNNER_TEMP/b16-package-list.txt"
          grep -Eq 'SharpGrip.FluentValidation.AutoValidation.Mvc[[:space:]]+2\.0\.0' "$RUNNER_TEMP/b16-package-list.txt"
          grep -Eq 'FluentValidation[[:space:]]+12\.1\.1' "$RUNNER_TEMP/b16-package-list.txt"
          echo "b16_fluentvalidation_resolved=12.1.1"
          echo "b16_sharpgrip_resolved=2.0.0"

      - name: Audit NuGet security
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list             --project Backend/antigal.server.slnx             --vulnerable             --include-transitive             --no-restore | tee "$RUNNER_TEMP/b16-vulnerable.txt"

          if grep -Fq "has the following vulnerable packages" "$RUNNER_TEMP/b16-vulnerable.txt"; then
            echo "B16 dependency graph contains vulnerable NuGet packages" >&2
            exit 1
          fi

      - name: Verify validation packages are current
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list             --project Backend/antigal.server.slnx             --outdated             --no-restore | tee "$RUNNER_TEMP/b16-outdated.txt"

          for package in FluentValidation.DependencyInjectionExtensions SharpGrip.FluentValidation.AutoValidation.Mvc; do
            if grep -Eq "^[[:space:]]*>[[:space:]]+$package[[:space:]]" "$RUNNER_TEMP/b16-outdated.txt"; then
              echo "$package is still outdated after B16" >&2
              exit 1
            fi
          done

          echo "b16_targeted_outdated_packages=0"

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload B16 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b16-fluentvalidation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/b16-backend-build.txt
            ${{ runner.temp }}/b16-backend-tests.txt
            ${{ runner.temp }}/b16-package-list.txt
            ${{ runner.temp }}/b16-vulnerable.txt
            ${{ runner.temp }}/b16-outdated.txt
