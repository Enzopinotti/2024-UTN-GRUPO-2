name: B29 order sale persistence characterization

on:
  push:
    branches:
      - modernize/b29-order-sale-persistence-authority-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Characterize order and sale persistence authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("Backend/antigal.server")
          order_service = (root / "Services/OrderService.cs").read_text(encoding="utf-8-sig")
          sale_service = (root / "Services/SaleService.cs").read_text(encoding="utf-8-sig")
          order_repo = (root / "Repositories/OrderRepository.cs").read_text(encoding="utf-8-sig")
          sale_repo = (root / "Repositories/SaleRepository.cs").read_text(encoding="utf-8-sig")
          product_repo = (root / "Repositories/ProductRepository.cs").read_text(encoding="utf-8-sig")

          def method(source, signature):
              match = re.search(signature + r".*?\n        \}", source, flags=re.S)
              if not match:
                  raise SystemExit(f"missing method for pattern: {signature}")
              return match.group(0)

          confirm = method(order_service, r"public async Task ConfirmOrder\(")
          update_sale = method(sale_service, r"public async Task<bool> UpdateSaleStatusAsync\(")
          update_order_repo = method(order_repo, r"public async Task<bool> UpdateOrderStatusAsync\(")
          create_sale_repo = method(sale_repo, r"public async Task<Sale\?> CreateSaleAsync\(")
          update_sale_repo = method(sale_repo, r"public async Task<bool> UpdateSaleAsync\(")
          update_product_repo = method(product_repo, r"public async Task<bool> UpdateProductAsync\(")

          print(f"order-confirm-unitofwork-save-count={confirm.count('_unitOfWork.SaveChangesAsync()')}")
          print(f"order-confirm-begin-transaction={'_unitOfWork.BeginTransactionAsync()' in confirm}")
          print(f"order-confirm-commit-transaction={'transaction.CommitAsync()' in confirm}")
          print(f"order-confirm-rollback-transaction={'transaction.RollbackAsync()' in confirm}")
          print(f"order-confirm-order-repository-update={'_unitOfWork.Orders.UpdateOrderStatusAsync' in confirm}")
          print(f"order-confirm-sale-repository-create={'_unitOfWork.Sales.CreateSaleAsync' in confirm}")
          print(f"order-confirm-product-repository-update={'_unitOfWork.Products.UpdateProductAsync' in confirm}")

          print(f"sale-update-service-unitofwork-save-count={update_sale.count('_unitOfWork.SaveChangesAsync()')}")
          print(f"order-repository-update-self-save-count={update_order_repo.count('_context.SaveChangesAsync()')}")
          print(f"sale-repository-create-self-save-count={create_sale_repo.count('_context.SaveChangesAsync()')}")
          print(f"sale-repository-update-self-save-count={update_sale_repo.count('_context.SaveChangesAsync()')}")
          print(f"product-repository-update-self-save-count={update_product_repo.count('_context.SaveChangesAsync()')}")

          required = {
              "confirm transaction begin": "_unitOfWork.BeginTransactionAsync()" in confirm,
              "confirm transaction commit": "transaction.CommitAsync()" in confirm,
              "confirm transaction rollback": "transaction.RollbackAsync()" in confirm,
              "confirm redundant final save": confirm.count("_unitOfWork.SaveChangesAsync()") == 1,
              "order repository self-save": update_order_repo.count("_context.SaveChangesAsync()") == 1,
              "sale create repository self-save": create_sale_repo.count("_context.SaveChangesAsync()") == 1,
              "product update repository self-save": update_product_repo.count("_context.SaveChangesAsync()") == 1,
              "sale service redundant save": update_sale.count("_unitOfWork.SaveChangesAsync()") == 1,
              "sale update repository self-save": update_sale_repo.count("_context.SaveChangesAsync()") == 1,
          }

          failed = [name for name, ok in required.items() if not ok]
          if failed:
              for item in failed:
                  print(f"FAIL: {item}")
              raise SystemExit(1)
          PY

      - name: Verify checkout remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
