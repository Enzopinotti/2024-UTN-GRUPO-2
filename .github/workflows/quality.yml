name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-authorship-security-baseline
      - modernize/b8a-empty-cart-lottie-removal-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Verify frontend runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          test "$(cat .nvmrc)" = "24.20.0"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          dotnet --version

      - name: Verify integrated source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("Frontend/antigal.client")
          package = json.loads((base / "package.json").read_text(encoding="utf-8-sig"))
          lock = json.loads((base / "package-lock.json").read_text(encoding="utf-8-sig"))
          root = lock["packages"][""]

          assert package.get("dependencies", {}) == root.get("dependencies", {})
          assert package.get("devDependencies", {}) == root.get("devDependencies", {})

          frontend_tooling = {
              "@eslint/js",
              "@testing-library/jest-dom",
              "@testing-library/react",
              "@testing-library/user-event",
              "@vitejs/plugin-react",
              "concurrently",
              "eslint",
              "eslint-plugin-react-hooks",
              "globals",
              "jsdom",
              "json-server",
              "sass",
              "vite",
              "vitest",
          }
          removed_cra_tooling = {
              "@babel/plugin-proposal-private-property-in-object",
              "@eslint/object-schema",
              "@rollup/plugin-terser",
              "@svgr/webpack",
              "css-minimizer-webpack-plugin",
              "eslint-config-react-app",
              "html-webpack-plugin",
              "react-scripts",
              "webpack-dev-server",
          }
          removed_runtime_tooling = {
              "@lottiefiles/react-lottie-player",
              "lottie-web",
          }
          dependencies = set(package.get("dependencies", {}))
          dev_dependencies = set(package.get("devDependencies", {}))
          lock_packages = set(lock.get("packages", {}))
          assert not frontend_tooling & dependencies
          assert frontend_tooling <= dev_dependencies
          assert not removed_cra_tooling & dependencies
          assert not removed_cra_tooling & dev_dependencies
          assert not removed_runtime_tooling & dependencies
          assert not removed_runtime_tooling & dev_dependencies
          assert "node_modules/@lottiefiles/react-lottie-player" not in lock_packages
          assert "node_modules/lottie-web" not in lock_packages

          scripts = package.get("scripts", {})
          assert scripts.get("start") == "vite"
          assert scripts.get("build") == "vite build"
          assert scripts.get("test") == "vitest run"
          assert scripts.get("lint") == "eslint src"
          assert "eject" not in scripts
          assert package.get("dependencies", {}).get("prop-types") == "15.8.1"
          assert package.get("dependencies", {}).get("react-router-dom") == "7.18.4"

          assert (base / "vite.config.mjs").is_file()
          assert (base / "eslint.config.mjs").is_file()
          assert (base / "index.html").is_file()
          assert not (base / "public/index.html").exists()
          assert not (base / "public/json/empty-cart-animation.json").exists()

          required = [
              base / "src/pages/Home.js",
              base / "src/contexts/CartContext.js",
              Path("Backend/antigal.server/Models/Dto/ResponseDto.cs"),
              Path("Backend/antigal.server/Models/Orden.cs"),
              Path("Backend/antigal.server/Models/OrdenDetalle.cs"),
              Path("Backend/antigal.server/Models/Dto/OrdenDto.cs"),
              Path("Backend/antigal.server/Relationships/ProductoCategoria.cs"),
              Path("Backend/antigal.server/Services/IImageService.cs"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing reconstructed source authority: {missing}")

          print("integrated-source-authority=present")
          print("frontend-manifest-lock-root=matched")
          print("frontend-vite-vitest-authority=present")
          print("frontend-cra-authority=absent")
          print("frontend-lottie-runtime-authority=absent")
          duplicate_order_types = [
              Path("Backend/antigal.server/Models/Order.cs"),
              Path("Backend/antigal.server/Models/OrderItem.cs"),
              Path("Backend/antigal.server/Models/Dto/OrderDto.cs"),
          ]
          duplicates = [str(path) for path in duplicate_order_types if path.exists()]
          if duplicates:
              raise SystemExit(f"duplicate English order model authority returned: {duplicates}")

          print("frontend-eslint-authority=present")
          print("order-model-authority=spanish-domain")

          server_project = Path("Backend/antigal.server/antigal.server.csproj").read_text(encoding="utf-8-sig")
          email_project = Path("Backend/EmailService/EmailService.csproj").read_text(encoding="utf-8-sig")

          assert 'Include="NETCore.MailKit"' not in server_project
          assert 'Include="NETCore.MailKit"' not in email_project
          assert 'Include="MailKit" Version="4.18.0"' in email_project
          assert 'Include="MimeKit" Version="4.18.0"' in email_project
          assert 'Include="MailKit"' not in server_project
          assert 'Include="MimeKit"' not in server_project
          assert 'Include="Microsoft.AspNetCore.Identity"' not in email_project
          assert 'Include="Microsoft.AspNetCore.Identity.EntityFrameworkCore"' not in email_project
          assert 'Include="AutoMapper"' not in server_project
          assert not Path("Backend/antigal.server/Mapping/MappingProfile.cs").exists()
          assert Path("Backend/antigal.server/Mapping/UserRegistrationMapper.cs").is_file()

          required_server_packages = (
              'Microsoft.AspNetCore.Authentication.JwtBearer" Version="8.0.31"',
              'Microsoft.AspNetCore.Identity.EntityFrameworkCore" Version="8.0.31"',
              'Microsoft.EntityFrameworkCore" Version="8.0.31"',
              'Microsoft.EntityFrameworkCore.SqlServer" Version="8.0.31"',
              'Microsoft.EntityFrameworkCore.Tools" Version="8.0.31"',
              'NPOI" Version="2.7.6"',
              'SixLabors.ImageSharp" Version="2.1.13"',
              'System.IdentityModel.Tokens.Jwt" Version="8.19.2"',
              'System.Security.Cryptography.Xml" Version="8.0.4"',
          )
          for package in required_server_packages:
              assert package in server_project, f"missing maintained server package pin: {package}"

          forbidden_server_packages = (
              "dotenv.net",
              "FluentEmail.Core",
              "FluentEmail.SendGrid",
              "Microsoft.AspNetCore.Authentication.OpenIdConnect",
              'Microsoft.AspNetCore.Identity"',
              "Microsoft.AspNetCore.OpenApi",
              "Microsoft.Extensions.Logging",
              "Microsoft.VisualStudio.Web.CodeGeneration.Design",
              'SendGrid"',
              "AutoMapper",
          )
          for package in forbidden_server_packages:
              assert package not in server_project, f"removed server package reintroduced: {package}"

          print("mail-dependency-boundary=clean")
          print("registration-mapping-boundary=explicit")
          print("net8-security-package-boundary=clean")
          PY

      - name: Reject unresolved merge markers in source authority
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' --             Frontend/antigal.client             Backend/antigal.server; then
            echo "Unresolved merge markers found in maintained source." >&2
            exit 1
          fi

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate direct production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend behavior
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build frontend
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.txt"

      - name: Verify frontend build runtime warnings
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "frontend-build.txt").read_text()
          eval_warnings = text.count("[EVAL]")
          print(f"frontend_direct_eval_warnings={eval_warnings}")
          if eval_warnings:
              raise SystemExit("frontend build regained direct eval warnings")
          print("B8a frontend direct-eval boundary passed.")
          PY

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee "$RUNNER_TEMP/backend-build.txt"

      - name: Verify backend compiler is warning-free
        shell: bash
        run: |
          python3 - <<'PY' | tee "$RUNNER_TEMP/backend-warning-summary.txt"
          import os
          import re
          from pathlib import Path

          lines = (Path(os.environ["RUNNER_TEMP"]) / "backend-build.txt").read_text().splitlines()
          pattern = re.compile(
              r"(?P<path>[^\s:]+\.cs)\((?P<line>\d+),(?P<col>\d+)\): warning (?P<code>CS\d+):"
          )

          unique = {}
          for line in lines:
              match = pattern.search(line)
              if not match:
                  continue
              key = (
                  match.group("path"),
                  int(match.group("line")),
                  int(match.group("col")),
                  match.group("code"),
              )
              unique[key] = line

          counts = {}
          files = {}
          for path, _line, _col, code in unique:
              counts[code] = counts.get(code, 0) + 1
              name = Path(path).name
              files[name] = files.get(name, 0) + 1

          print(f"backend_unique_warnings={len(unique)}")
          for code in sorted(counts):
              print(f"backend_{code}={counts[code]}")
          for name in sorted(files):
              print(f"backend_warning_file_{name}={files[name]}")

          if unique:
              raise SystemExit(
                  f"backend compiler warning-free boundary regressed: {len(unique)} warnings, "
                  f"codes={counts}, files={files}"
              )

          print("B7b2 backend compiler warning-free boundary passed.")
          PY

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security boundary
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Capture known dependency advisory baseline
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/frontend-audit.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/frontend-production-audit.json" || true
          )
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive > solution-vulnerable.txt

          python3 - <<'PY' | tee quality-summary.txt
          import json
          from pathlib import Path

          audit = json.loads(Path("frontend-audit.json").read_text())
          vulns = audit.get("metadata", {}).get("vulnerabilities", {})
          print("frontend_audit_total=" + str(vulns.get("total", 0)))
          print("frontend_audit_high=" + str(vulns.get("high", 0)))
          print("frontend_audit_critical=" + str(vulns.get("critical", 0)))

          production_audit = json.loads(Path("frontend-production-audit.json").read_text())
          production = production_audit.get("metadata", {}).get("vulnerabilities", {})
          production_total = production.get("total", 0)
          production_high = production.get("high", 0)
          production_critical = production.get("critical", 0)
          print("frontend_production_audit_total=" + str(production_total))
          print("frontend_production_audit_high=" + str(production_high))
          print("frontend_production_audit_critical=" + str(production_critical))

          full_total = vulns.get("total", 0)
          if full_total != 0:
              raise SystemExit(
                  "frontend dependency graph is no longer clean: "
                  + str(full_total)
              )
          if production_total != 0:
              raise SystemExit(
                  "frontend production dependency graph is no longer clean: "
                  + str(production_total)
              )

          solution = Path("solution-vulnerable.txt").read_text()
          solution_clean = "has the following vulnerable packages" not in solution
          print("nuget_solution_vulnerability_report_clean=" + str(solution_clean).lower())
          if not solution_clean:
              raise SystemExit("NuGet solution vulnerability audit is no longer clean")

          print("B7b2 warning-free backend, B7b1 order model authority, B7a product-filter nullability, B6c3 React Hook Form compatibility, B6c2e Auth hydration, B6c2d2 Profile draft state, B6c2d1 User addresses state, B6c2c Category form state, B6c2b Admin image state, B6c2a Carousel state, B6c1 Hook dependencies, B6a ESLint, B5b Router 7 and zero-advisory dependency-security contracts passed.")
          PY

      - name: Upload quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            quality-summary.txt
            frontend-audit.json
            frontend-production-audit.json
            solution-vulnerable.txt
            ${{ runner.temp }}/backend-build.txt
            ${{ runner.temp }}/backend-warning-summary.txt
