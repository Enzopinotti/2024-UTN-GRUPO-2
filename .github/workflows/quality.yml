name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-authorship-security-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.401"

      - name: Verify CI action runtime authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quality = Path(".github/workflows/quality.yml").read_text(encoding="utf-8")
          security = Path(".github/workflows/security-baseline.yml").read_text(encoding="utf-8")

          expected = {
              "actions/checkout": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/setup-node": "820762786026740c76f36085b0efc47a31fe5020",
              "actions/setup-dotnet": "a98b56852c35b8e3190ac28c8c2271da59106c68",
              "actions/upload-artifact": "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          }
          obsolete = {
              "11d5960a326750d5838078e36cf38b85af677262",
              "fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
              "49933ea5288caeca8642d1e84afbd3f7d6820020",
              "67a3573c9a986a3f9c594539f4ab511d57bb3ce9",
              "ea165f8d65b6e75b540449e92b4886f43607fa02",
          }

          import re

          quality_uses = set(re.findall(r"^\s*-?\s*uses:\s*([^\s#]+)", quality, flags=re.MULTILINE))
          security_uses = set(re.findall(r"^\s*-?\s*uses:\s*([^\s#]+)", security, flags=re.MULTILINE))
          combined_uses = quality_uses | security_uses

          for action, sha in expected.items():
              needle = f"{action}@{sha}"
              if needle not in combined_uses:
                  raise SystemExit(f"missing maintained Node 24 action pin: {needle}")

          returned = sorted(
              use for use in combined_uses
              if any(use.endswith(f"@{sha}") for sha in obsolete)
          )
          if returned:
              raise SystemExit(f"obsolete Node 20 action pins returned: {returned}")

          if f"actions/checkout@{expected['actions/checkout']}" not in security_uses:
              raise SystemExit("security workflow is not using the maintained checkout pin")

          print("github-actions-runtime-authority=node24")
          print("github-actions-sha-pinning=preserved")
          PY

      - name: Verify frontend runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          test "$(cat .nvmrc)" = "24.20.0"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          test "$(dotnet --version)" = "10.0.401"
          test "$(python3 -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')" = "10.0.401"
          echo "dotnet=$(dotnet --version)"

      - name: Verify integrated source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("Frontend/antigal.client")
          package = json.loads((base / "package.json").read_text(encoding="utf-8-sig"))
          lock = json.loads((base / "package-lock.json").read_text(encoding="utf-8-sig"))
          root = lock["packages"][""]

          assert package.get("dependencies", {}) == root.get("dependencies", {})
          assert package.get("devDependencies", {}) == root.get("devDependencies", {})

          frontend_tooling = {
              "@eslint/js",
              "@testing-library/jest-dom",
              "@testing-library/react",
              "@testing-library/user-event",
              "@vitejs/plugin-react",
              "eslint",
              "eslint-plugin-react-hooks",
              "globals",
              "jsdom",
              "json-server",
              "sass",
              "vite",
              "vitest",
          }
          removed_cra_tooling = {
              "@babel/plugin-proposal-private-property-in-object",
              "@eslint/object-schema",
              "@rollup/plugin-terser",
              "@svgr/webpack",
              "css-minimizer-webpack-plugin",
              "eslint-config-react-app",
              "html-webpack-plugin",
              "react-scripts",
              "webpack-dev-server",
          }
          removed_runtime_tooling = {
              "@lottiefiles/react-lottie-player",
              "@mercadopago/sdk-react",
              "@react-google-maps/api",
              "lottie-web",
              "web-vitals",
          }
          dependencies = set(package.get("dependencies", {}))
          dev_dependencies = set(package.get("devDependencies", {}))
          lock_packages = set(lock.get("packages", {}))
          assert not frontend_tooling & dependencies
          assert frontend_tooling <= dev_dependencies
          assert not removed_cra_tooling & dependencies
          assert not removed_cra_tooling & dev_dependencies
          assert not removed_runtime_tooling & dependencies
          assert not removed_runtime_tooling & dev_dependencies
          assert "node_modules/@lottiefiles/react-lottie-player" not in lock_packages
          assert "node_modules/@mercadopago/sdk-react" not in lock_packages
          assert "node_modules/@react-google-maps/api" not in lock_packages
          assert "node_modules/lottie-web" not in lock_packages
          assert "node_modules/web-vitals" not in lock_packages

          scripts = package.get("scripts", {})
          assert scripts.get("start") == "vite"
          assert scripts.get("dev") == "vite"
          assert scripts.get("build") == "vite build"
          assert scripts.get("test") == "vitest run"
          assert scripts.get("lint") == "eslint src"
          assert "sass" not in scripts
          assert "eject" not in scripts
          assert package.get("devDependencies", {}).get("sass") is not None
          assert "concurrently" not in package.get("dependencies", {})
          assert "concurrently" not in package.get("devDependencies", {})
          assert "node_modules/concurrently" not in lock_packages
          assert package.get("dependencies", {}).get("prop-types") == "15.8.1"
          assert package.get("dependencies", {}).get("react") == "19.3.0"
          assert package.get("dependencies", {}).get("react-dom") == "19.3.0"
          assert package.get("dependencies", {}).get("react-router-dom") == "7.18.4"
          assert package.get("devDependencies", {}).get("@testing-library/react") == "16.3.3"
          assert package.get("devDependencies", {}).get("@testing-library/user-event") == "14.6.7"
          assert package.get("devDependencies", {}).get("@testing-library/dom") == "10.4.2"

          assert (base / "vite.config.mjs").is_file()
          assert (base / "eslint.config.mjs").is_file()
          assert (base / "index.html").is_file()
          assert (base / "src/styles/scss/index.scss").is_file()
          assert not (base / "src/styles/css").exists()
          vite_config = (base / "vite.config.mjs").read_text(encoding="utf-8-sig")
          assert "transformWithOxc" not in vite_config
          assert "jsxInLegacyJs" not in vite_config
          assert not (base / "public/index.html").exists()
          assert not (base / "public/json/empty-cart-animation.json").exists()

          required = [
              base / "src/pages/Home.jsx",
              base / "src/contexts/CartContext.jsx",
              Path("Backend/antigal.server/Models/Dto/ResponseDto.cs"),
              Path("Backend/antigal.server/Models/Orden.cs"),
              Path("Backend/antigal.server/Models/OrdenDetalle.cs"),
              Path("Backend/antigal.server/Models/Dto/OrdenDto.cs"),
              Path("Backend/antigal.server/Relationships/ProductoCategoria.cs"),
              Path("Backend/antigal.server/Services/IImageService.cs"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing reconstructed source authority: {missing}")

          print("integrated-source-authority=present")
          print("frontend-manifest-lock-root=matched")
          print("frontend-vite-vitest-authority=present")
          print("frontend-react-runtime=19.3.0")
          print("frontend-testing-library-runtime=16.3.3")
          print("frontend-cra-authority=absent")
          print("frontend-lottie-runtime-authority=absent")
          print("frontend-dead-runtime-packages=absent")
          print("frontend-native-sass-authority=present")
          print("frontend-generated-css-authority=absent")
          print("frontend-concurrently-authority=absent")
          duplicate_order_types = [
              Path("Backend/antigal.server/Models/Order.cs"),
              Path("Backend/antigal.server/Models/OrderItem.cs"),
              Path("Backend/antigal.server/Models/Dto/OrderDto.cs"),
          ]
          duplicates = [str(path) for path in duplicate_order_types if path.exists()]
          if duplicates:
              raise SystemExit(f"duplicate English order model authority returned: {duplicates}")

          print("frontend-eslint-authority=present")
          print("frontend-jsx-extension-authority=present")
          print("frontend-legacy-jsx-transform=absent")
          print("order-model-authority=spanish-domain")

          server_project_path = Path("Backend/antigal.server/antigal.server.csproj")
          email_project_path = Path("Backend/EmailService/EmailService.csproj")
          test_project_path = Path("Backend/antigal.server.Tests/antigal.server.Tests.csproj")
          server_project = server_project_path.read_text(encoding="utf-8-sig")
          email_project = email_project_path.read_text(encoding="utf-8-sig")
          test_project = test_project_path.read_text(encoding="utf-8-sig")

          assert "<TargetFramework>net10.0</TargetFramework>" in server_project
          assert "<TargetFramework>net10.0</TargetFramework>" in email_project
          assert "<TargetFramework>net10.0</TargetFramework>" in test_project
          global_json = json.loads(Path("global.json").read_text(encoding="utf-8-sig"))
          assert global_json["sdk"]["version"] == "10.0.401"
          assert global_json["sdk"]["rollForward"] == "disable"
          assert global_json["sdk"]["allowPrerelease"] is False

          solution = Path("Backend/antigal.server.slnx")
          legacy_solution = Path("Backend/antigal.server.sln")
          assert solution.is_file()
          assert not legacy_solution.exists()
          solution_text = solution.read_text(encoding="utf-8-sig")
          for project_path in (
              "antigal.server/antigal.server.csproj",
              "EmailService/EmailService.csproj",
              "antigal.server.Tests/antigal.server.Tests.csproj",
          ):
              assert f'Project Path="{project_path}"' in solution_text

          assert 'Include="NETCore.MailKit"' not in server_project
          assert 'Include="NETCore.MailKit"' not in email_project
          assert 'Include="MailKit" Version="4.18.0"' in email_project
          assert 'Include="MimeKit" Version="4.18.1"' in email_project
          assert 'Include="MailKit"' not in server_project
          assert 'Include="MimeKit"' not in server_project
          assert 'Include="Microsoft.AspNetCore.Identity"' not in email_project
          assert 'Include="Microsoft.AspNetCore.Identity.EntityFrameworkCore"' not in email_project
          assert 'Include="AutoMapper"' not in server_project
          assert not Path("Backend/antigal.server/Mapping/MappingProfile.cs").exists()
          assert Path("Backend/antigal.server/Mapping/UserRegistrationMapper.cs").is_file()

          required_server_packages = (
              'CloudinaryDotNet" Version="1.29.3"',
              'FluentValidation.DependencyInjectionExtensions" Version="12.1.1"',
              'mercadopago-sdk" Version="3.7.0"',
              'Microsoft.AspNetCore.Authentication.JwtBearer" Version="10.0.12"',
              'Microsoft.AspNetCore.Identity.EntityFrameworkCore" Version="10.0.12"',
              'Microsoft.EntityFrameworkCore" Version="10.0.12"',
              'Microsoft.EntityFrameworkCore.SqlServer" Version="10.0.12"',
              'Microsoft.EntityFrameworkCore.Tools" Version="10.0.12"',
              'NPOI" Version="2.7.6"',
              'SharpGrip.FluentValidation.AutoValidation.Mvc" Version="2.0.0"',
              'Swashbuckle.AspNetCore" Version="10.2.3"',
              'System.IdentityModel.Tokens.Jwt" Version="8.23.0"',
              'System.Security.Cryptography.Xml" Version="10.0.12" NoWarn="NU1510"',
          )
          for package in required_server_packages:
              assert package in server_project, f"missing maintained server package pin: {package}"

          forbidden_server_packages = (
              "dotenv.net",
              "FluentEmail.Core",
              "FluentEmail.SendGrid",
              "Microsoft.AspNetCore.Authentication.OpenIdConnect",
              'Microsoft.AspNetCore.Identity"',
              "Microsoft.AspNetCore.OpenApi",
              "Microsoft.Extensions.Logging",
              "Microsoft.VisualStudio.Web.CodeGeneration.Design",
              'SendGrid"',
              "AutoMapper",
              "SixLabors.ImageSharp",
          )
          for package in forbidden_server_packages:
              assert package not in server_project, f"removed server package reintroduced: {package}"

          print("mail-dependency-boundary=clean")
          print("registration-mapping-boundary=explicit")
          print("dotnet-sdk-authority=10.0.401")
          print("dotnet-target-framework=net10.0")
          print("dotnet-solution-authority=slnx")
          print("dotnet-legacy-sln-authority=absent")
          print("backend-cloudinary=1.29.3")
          print("backend-fluentvalidation-di=12.1.1")
          print("backend-mercadopago-sdk=3.7.0")
          print("backend-system-identitymodel-tokens-jwt=8.23.0")
          program_text = Path("Backend/antigal.server/Program.cs").read_text(encoding="utf-8-sig")
          assert "using Microsoft.OpenApi;" in program_text
          assert "Microsoft.OpenApi.Models" not in program_text
          assert "OpenApiReference" not in program_text
          assert 'OpenApiSecuritySchemeReference("Bearer", document)' in program_text
          assert Path("Backend/antigal.server.Tests/SwaggerSdkCompatibilityTests.cs").is_file()

          print("backend-sharpgrip-autovalidation=2.0.0")
          print("backend-swashbuckle=10.2.3")
          print("backend-microsoft-openapi-v2-surface=present")
          print("backend-legacy-openapi-reference=absent")
          print("backend-imagesharp-authority=absent")
          print("backend-npoi=2.7.6-held")
          print("email-mimekit=4.18.1")
          print("dotnet10-security-package-boundary=clean")
          PY

      - name: Validate backend email DI authority
        run: python3 scripts/backend_di_authority.py

      - name: Validate JWT expiration configuration authority
        run: python3 scripts/jwt_configuration_authority.py

      - name: Validate backend token authority
        run: python3 scripts/backend_token_authority.py

      - name: Validate backend repository DI authority
        run: python3 scripts/backend_repository_di_authority.py

      - name: Validate backend Like repository authority
        run: python3 scripts/backend_like_repository_authority.py

      - name: Validate backend Contacto repository authority
        run: python3 scripts/backend_contacto_repository_authority.py

      - name: Validate backend direct-context persistence authority
        run: python3 scripts/backend_direct_context_persistence_authority.py

      - name: Validate backend UnitOfWork contract authority
        run: python3 scripts/backend_unitofwork_contract_authority.py

      - name: Validate backend order/sale persistence authority
        run: python3 scripts/backend_order_sale_persistence_authority.py

      - name: Validate backend product persistence authority
        run: python3 scripts/backend_product_persistence_authority.py

      - name: Validate backend ResponseDto authority
        run: python3 scripts/backend_response_dto_authority.py

      - name: Reject unresolved merge markers in source authority
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' --             Frontend/antigal.client             Backend/antigal.server; then
            echo "Unresolved merge markers found in maintained source." >&2
            exit 1
          fi

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate direct production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Validate JSX extension authority
        run: node scripts/jsx_extension_authority.mjs

      - name: Validate dead frontend source authority
        run: node scripts/dead_source_inventory.mjs

      - name: Validate native Sass authority
        run: node scripts/style_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend behavior without deprecated act bridge
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/frontend-tests.txt"

          if grep -Fq 'ReactDOMTestUtils.act' "$RUNNER_TEMP/frontend-tests.txt"; then
            echo "Deprecated react-dom/test-utils act bridge returned" >&2
            exit 1
          fi

          echo "frontend_deprecated_act_bridge=absent"

      - name: Build frontend
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.txt"

      - name: Verify frontend build runtime and chunk boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "frontend-build.txt").read_text()
          eval_warnings = text.count("[EVAL]")
          chunk_warnings = text.count("Some chunks are larger than 500 kB")

          assets = Path("Frontend/antigal.client/build/assets")
          entry_chunks = sorted(assets.glob("index-*.js"))
          entry_css = sorted(assets.glob("index-*.css"))
          store_css = sorted(assets.glob("TiendaFisica-*.css"))
          if len(entry_chunks) != 1:
              raise SystemExit(
                  f"expected exactly one Vite entry chunk, found {len(entry_chunks)}"
              )
          if len(entry_css) != 1:
              raise SystemExit(
                  f"expected exactly one Vite entry stylesheet, found {len(entry_css)}"
              )
          if len(store_css) != 1:
              raise SystemExit(
                  f"expected exactly one route-scoped TiendaFisica stylesheet, found {len(store_css)}"
              )

          entry_bytes = entry_chunks[0].stat().st_size
          entry_kib = entry_bytes / 1024
          entry_css_kib = entry_css[0].stat().st_size / 1024
          store_css_kib = store_css[0].stat().st_size / 1024
          js_chunk_count = len(list(assets.glob("*.js")))
          sass_deprecations = text.lower().count("deprecation warning")

          print(f"frontend_direct_eval_warnings={eval_warnings}")
          print(f"frontend_chunk_size_warnings={chunk_warnings}")
          print(f"frontend_js_chunk_count={js_chunk_count}")
          print(f"frontend_entry_chunk_kib={entry_kib:.2f}")
          print(f"frontend_entry_css_kib={entry_css_kib:.2f}")
          print(f"frontend_tienda_fisica_css_kib={store_css_kib:.2f}")
          print(f"frontend_sass_deprecation_warnings={sass_deprecations}")

          if eval_warnings:
              raise SystemExit("frontend build regained direct eval warnings")
          if chunk_warnings:
              raise SystemExit("frontend build regained >500 kB chunk warnings")
          if entry_kib > 320:
              raise SystemExit(
                  f"frontend entry chunk regressed above B8b 320 KiB ceiling: {entry_kib:.2f}"
              )
          if not 132 <= entry_css_kib <= 136:
              raise SystemExit(
                  "frontend entry stylesheet escaped B12 native Sass envelope "
                  f"(132-136 KiB): {entry_css_kib:.2f}"
              )
          if not 12 <= store_css_kib <= 14:
              raise SystemExit(
                  "TiendaFisica stylesheet escaped B12 route-scoped envelope "
                  f"(12-14 KiB): {store_css_kib:.2f}"
              )
          if sass_deprecations:
              raise SystemExit(
                  f"frontend native Sass build regained deprecations: {sass_deprecations}"
              )

          print("B12 native Sass, B8b route-splitting and B8a direct-eval boundaries passed.")
          PY

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.slnx

      - name: Build backend
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.slnx -c Release --no-restore | tee "$RUNNER_TEMP/backend-build.txt"

      - name: Verify backend compiler is warning-free
        shell: bash
        run: |
          python3 - <<'PY' | tee "$RUNNER_TEMP/backend-warning-summary.txt"
          import os
          import re
          from pathlib import Path

          lines = (Path(os.environ["RUNNER_TEMP"]) / "backend-build.txt").read_text().splitlines()
          pattern = re.compile(
              r"(?P<path>[^\s:]+\.cs)\((?P<line>\d+),(?P<col>\d+)\): warning (?P<code>CS\d+):"
          )

          unique = {}
          for line in lines:
              match = pattern.search(line)
              if not match:
                  continue
              key = (
                  match.group("path"),
                  int(match.group("line")),
                  int(match.group("col")),
                  match.group("code"),
              )
              unique[key] = line

          counts = {}
          files = {}
          for path, _line, _col, code in unique:
              counts[code] = counts.get(code, 0) + 1
              name = Path(path).name
              files[name] = files.get(name, 0) + 1

          print(f"backend_unique_warnings={len(unique)}")
          for code in sorted(counts):
              print(f"backend_{code}={counts[code]}")
          for name in sorted(files):
              print(f"backend_warning_file_{name}={files[name]}")

          if unique:
              raise SystemExit(
                  f"backend compiler warning-free boundary regressed: {len(unique)} warnings, "
                  f"codes={counts}, files={files}"
              )

          print("B7b2 backend compiler warning-free boundary passed.")
          PY

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security boundary
        run: python3 scripts/security_baseline.py

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Capture known dependency advisory baseline
        shell: bash
        run: |
          set -euo pipefail
          (
            cd Frontend/antigal.client
            npm audit --json > "$GITHUB_WORKSPACE/frontend-audit.json" || true
            npm audit --omit=dev --json > "$GITHUB_WORKSPACE/frontend-production-audit.json" || true
          )
          dotnet package list --project Backend/antigal.server.slnx --vulnerable --include-transitive --no-restore > solution-vulnerable.txt

          python3 - <<'PY' | tee quality-summary.txt
          import json
          from pathlib import Path

          audit = json.loads(Path("frontend-audit.json").read_text())
          vulns = audit.get("metadata", {}).get("vulnerabilities", {})
          print("frontend_audit_total=" + str(vulns.get("total", 0)))
          print("frontend_audit_high=" + str(vulns.get("high", 0)))
          print("frontend_audit_critical=" + str(vulns.get("critical", 0)))

          production_audit = json.loads(Path("frontend-production-audit.json").read_text())
          production = production_audit.get("metadata", {}).get("vulnerabilities", {})
          production_total = production.get("total", 0)
          production_high = production.get("high", 0)
          production_critical = production.get("critical", 0)
          print("frontend_production_audit_total=" + str(production_total))
          print("frontend_production_audit_high=" + str(production_high))
          print("frontend_production_audit_critical=" + str(production_critical))

          full_total = vulns.get("total", 0)
          if full_total != 0:
              raise SystemExit(
                  "frontend dependency graph is no longer clean: "
                  + str(full_total)
              )
          if production_total != 0:
              raise SystemExit(
                  "frontend production dependency graph is no longer clean: "
                  + str(production_total)
              )

          solution = Path("solution-vulnerable.txt").read_text()
          solution_clean = "has the following vulnerable packages" not in solution
          print("nuget_solution_vulnerability_report_clean=" + str(solution_clean).lower())
          if not solution_clean:
