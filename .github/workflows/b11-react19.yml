name: B11 React 19 Lab

on:
  push:
    branches:
      - modernize/b11-react19-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b11-react19-lab
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B11 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Verify retired runtime packages have no frontend callers
        shell: bash
        run: |
          set -euo pipefail
          retired='@mercadopago/sdk-react|@react-google-maps/api|web-vitals'
          if git grep -n -E "$retired" -- Frontend/antigal.client/src; then
            echo "A runtime package selected for B11 pruning still has a source caller" >&2
            exit 1
          fi
          echo "b11_retired_runtime_callers=0"

      - name: Remove dead runtime packages and install React 19 without peer overrides
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm uninstall             @mercadopago/sdk-react             @react-google-maps/api             web-vitals 2>&1 | tee "$GITHUB_WORKSPACE/b11-install.txt"
          npm install --save-exact react@19.3.0 react-dom@19.3.0 2>&1 | tee -a "$GITHUB_WORKSPACE/b11-install.txt"

      - name: Install exact React 19 candidate
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Verify React 19 dependency tree
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm ls             react             react-dom             react-router-dom             @testing-library/react             @mercadopago/sdk-react             @react-google-maps/api             react-slick 2>&1 | tee "$GITHUB_WORKSPACE/b11-react-tree.txt"

      - name: Inventory legacy ReactDOM APIs in runtime dependencies
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/b11-legacy-react-dom-api.txt"
          for package in react-slick; do
            path="node_modules/$package"
            if [ -d "$path" ]; then
              grep -R -n -E 'findDOMNode|ReactDOM\.render|unmountComponentAtNode' "$path"                 --include='*.js' --include='*.mjs' --include='*.cjs'                 >> "$GITHUB_WORKSPACE/b11-legacy-react-dom-api.txt" || true
            fi
          done
          cat "$GITHUB_WORKSPACE/b11-legacy-react-dom-api.txt"

      - name: Validate frontend source authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend_dependency_authority.mjs
          node scripts/jsx_extension_authority.mjs
          node scripts/dead_source_inventory.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend under React 19
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/b11-tests.txt"

          if grep -Fq 'ReactDOMTestUtils.act' "$GITHUB_WORKSPACE/b11-tests.txt"; then
            echo "Deprecated react-dom/test-utils act bridge returned" >&2
            exit 1
          fi

          grep -F 'Test Files' "$GITHUB_WORKSPACE/b11-tests.txt"
          grep -F 'Tests' "$GITHUB_WORKSPACE/b11-tests.txt"

      - name: Build frontend under React 19
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/b11-build.txt"

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend warning-free
        shell: bash
        run: |
          set -o pipefail
          dotnet build Backend/antigal.server.sln -c Release --no-restore | tee "$GITHUB_WORKSPACE/b11-backend-build.txt"
          if grep -Eq '[[:space:]][1-9][0-9]* Warning\(s\)' "$GITHUB_WORKSPACE/b11-backend-build.txt"; then
            echo "Backend warnings regressed" >&2
            exit 1
          fi

      - name: Test backend
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit React 19 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --json > "$GITHUB_WORKSPACE/b11-audit-all.json" || true
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/b11-audit-production.json" || true
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY' | tee b11-summary.txt
          import json
          from pathlib import Path

          def counts(path):
              data = json.loads(Path(path).read_text())
              return data.get("metadata", {}).get("vulnerabilities", {})

          full = counts("b11-audit-all.json")
          prod = counts("b11-audit-production.json")

          for label, values in (("all", full), ("production", prod)):
              for severity in ("low", "moderate", "high", "critical", "total"):
                  print(f"{label}_{severity}={values.get(severity, 0)}")

          if full.get("total", 0) != 0:
              raise SystemExit("B11 frontend dependency graph is not advisory-free")
          if prod.get("total", 0) != 0:
              raise SystemExit("B11 production dependency graph is not advisory-free")

          print("b11_react19_security_boundary=accepted")
          PY

      - name: Commit validated React 19 package authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/antigal.client/package.json Frontend/antigal.client/package-lock.json
          git diff --cached --quiet && { echo "No B11 package changes"; exit 0; }
          git commit -m "B11 lab: adopt React 19 runtime authority"
          git push origin HEAD:modernize/b11-react19-lab

      - name: Upload B11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b11-react19-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b11-install.txt
            b11-react-tree.txt
            b11-legacy-react-dom-api.txt
            b11-tests.txt
            b11-build.txt
            b11-backend-build.txt
            b11-summary.txt
            b11-audit-all.json
            b11-audit-production.json
