name: B8b route splitting lab

on:
  push:
    branches:
      - modernize/b8b-route-splitting-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b8b-route-splitting-lab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout triggering B8b commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: Frontend/antigal.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Install frontend exactly
        working-directory: Frontend/antigal.client
        run: npm ci

      - name: Validate production dependency authority
        run: node scripts/frontend_dependency_authority.mjs

      - name: Lint frontend
        working-directory: Frontend/antigal.client
        run: npm run lint -- --max-warnings 0

      - name: Test frontend behavior
        working-directory: Frontend/antigal.client
        env:
          CI: "true"
        run: npm test

      - name: Build and measure route chunks
        working-directory: Frontend/antigal.client
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/b8b-build.txt"
          node - <<'NODE' | tee "$GITHUB_WORKSPACE/b8b-chunks.txt"
          const fs = require("fs");
          const path = require("path");
          const root = "build/assets";
          const chunks = fs.readdirSync(root)
            .filter((name) => name.endsWith(".js"))
            .map((name) => {
              const bytes = fs.statSync(path.join(root, name)).size;
              return { name, bytes, kb: bytes / 1024 };
            })
            .sort((a, b) => b.bytes - a.bytes);

          console.log("js_chunk_count=" + chunks.length);
          for (const chunk of chunks.slice(0, 20)) {
            console.log(`${chunk.name}=${chunk.kb.toFixed(2)}KB`);
          }

          const index = chunks.find((chunk) => /^index-.*\.js$/.test(chunk.name));
          if (!index) throw new Error("Vite entry chunk was not found");
          console.log("entry_chunk_kb=" + index.kb.toFixed(2));
          NODE

      - name: Characterize Vite chunk warnings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee b8b-summary.txt
          from pathlib import Path

          text = Path("b8b-build.txt").read_text()
          chunk_warnings = text.count("Some chunks are larger than 500 kB")
          eval_warnings = text.count("[EVAL]")

          assets = Path("Frontend/antigal.client/build/assets")
          entry_chunks = sorted(assets.glob("index-*.js"))
          if len(entry_chunks) != 1:
              raise SystemExit(
                  f"expected exactly one Vite entry chunk, found {len(entry_chunks)}"
              )
          entry_kib = entry_chunks[0].stat().st_size / 1024

          print(f"chunk_size_warnings={chunk_warnings}")
          print(f"direct_eval_warnings={eval_warnings}")
          print(f"entry_chunk_kib={entry_kib:.2f}")
          if eval_warnings:
              raise SystemExit("B8b regressed the direct-eval-free boundary")
          if chunk_warnings:
              raise SystemExit("B8b regressed the >500 kB chunk-warning boundary")
          if entry_kib > 320:
              raise SystemExit(
                  f"B8b entry chunk exceeded 320 KiB: {entry_kib:.2f}"
              )
          PY

      - name: Restore backend
        run: dotnet restore Backend/antigal.server.sln

      - name: Build backend warning-free
        run: dotnet build Backend/antigal.server.sln -c Release --no-restore --warnaserror

      - name: Test backend behavior
        run: dotnet test Backend/antigal.server.Tests/antigal.server.Tests.csproj -c Release --no-build

      - name: Validate current-tree security
        run: python3 scripts/security_baseline.py

      - name: Audit maintained dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          cd Frontend/antigal.client
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          cd "$GITHUB_WORKSPACE"
          dotnet list Backend/antigal.server.sln package --vulnerable --include-transitive | tee b8b-nuget-vulnerable.txt
          if grep -q "has the following vulnerable packages" b8b-nuget-vulnerable.txt; then
            echo "NuGet vulnerability boundary regressed" >&2
            exit 1
          fi

      - name: Upload B8b evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b8b-route-splitting-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            b8b-build.txt
            b8b-chunks.txt
            b8b-summary.txt
            b8b-nuget-vulnerable.txt
