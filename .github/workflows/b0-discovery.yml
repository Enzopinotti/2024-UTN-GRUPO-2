name: B0 discovery

on:
  push:
    branches:
      - modernize/2026-authorship-security-baseline
    paths:
      - .github/workflows/b0-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout exact candidate with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup .NET 8 compatibility runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node 20 compatibility runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture runtime identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sha=$GITHUB_SHA"
            dotnet --version
            dotnet --info
            node --version
            npm --version
          } | tee b0-runtimes.txt

      - name: Verify current frontend authority is malformed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee b0-current-frontend-authority.txt
          import json
          from pathlib import Path

          base = Path("Frontend/antigal.client")
          expected = {
              "package.json": 9,
              "package-lock.json": 3,
          }

          for name, marker_count in expected.items():
              path = base / name
              raw = path.read_text(encoding="utf-8-sig")
              markers = sum(
                  1
                  for line in raw.splitlines()
                  if line.startswith(("<<<<<<<", "=======", ">>>>>>>"))
              )
              try:
                  json.loads(raw)
                  valid = True
              except json.JSONDecodeError:
                  valid = False
              print(f"{name}_valid_json={int(valid)}")
              print(f"{name}_conflict_markers={markers}")
              if valid or markers != marker_count:
                  raise SystemExit(
                      f"unexpected current authority state for {name}: "
                      f"valid={valid}, markers={markers}"
                  )
          PY

      - name: Reconstruct historical FrontEnd authority
        shell: bash
        run: |
          set -euo pipefail
          historical_sha="00692d5492dc21df8e3e86054d41bb980fc14564"
          worktree="$RUNNER_TEMP/frontend-authority"
          git worktree add --detach "$worktree" "$historical_sha"

          python3 - "$worktree/Frontend/antigal.client" <<'PY' | tee b0-frontend-authority.txt
          import json
          import sys
          from pathlib import Path

          base = Path(sys.argv[1])
          package = json.loads((base / "package.json").read_text(encoding="utf-8-sig"))
          lock = json.loads((base / "package-lock.json").read_text(encoding="utf-8-sig"))
          root = lock["packages"][""]

          print("historical_frontend_sha=00692d5492dc21df8e3e86054d41bb980fc14564")
          print(f"package_dependencies={len(package.get('dependencies', {}))}")
          print(f"package_dev_dependencies={len(package.get('devDependencies', {}))}")
          print(f"lockfile_version={lock.get('lockfileVersion')}")
          print(
              "manifest_lock_dependencies_match="
              + str(package.get("dependencies", {}) == root.get("dependencies", {})).lower()
          )
          print(
              "manifest_lock_dev_dependencies_match="
              + str(package.get("devDependencies", {}) == root.get("devDependencies", {})).lower()
          )

          if package.get("dependencies", {}) != root.get("dependencies", {}):
              raise SystemExit("historical package/lock dependency mismatch")
          if package.get("devDependencies", {}) != root.get("devDependencies", {}):
              raise SystemExit("historical package/lock devDependency mismatch")
          PY

      - name: Install and probe historical FrontEnd build
        shell: bash
        run: |
          set -euo pipefail
          frontend="$RUNNER_TEMP/frontend-authority/Frontend/antigal.client"

          (
            cd "$frontend"
            npm ci
          ) 2>&1 | tee b0-frontend-install.txt

          set +e
          (
            cd "$frontend"
            CI=true npm run build
          ) > b0-frontend-build-strict.txt 2>&1
          strict_code=$?

          (
            cd "$frontend"
            CI=false npm run build
          ) > b0-frontend-build-compatible.txt 2>&1
          compatible_code=$?

          (
            cd "$frontend"
            npm audit --json
          ) > b0-frontend-audit.json 2>/dev/null
          audit_code=$?
          set -e

          {
            echo "frontend_strict_build_exit=$strict_code"
            echo "frontend_compatible_build_exit=$compatible_code"
            echo "frontend_audit_exit=$audit_code"
          } | tee b0-frontend-build-status.txt

          python3 - <<'PY' | tee b0-frontend-audit-summary.txt
          import json
          from pathlib import Path

          data = json.loads(Path("b0-frontend-audit.json").read_text())
          vulnerabilities = data.get("metadata", {}).get("vulnerabilities", {})
          for key in ("info", "low", "moderate", "high", "critical", "total"):
              print(f"npm_audit_{key}={vulnerabilities.get(key, 0)}")
          PY

      - name: Probe historical frontend tests
        shell: bash
        run: |
          set -euo pipefail
          frontend="$RUNNER_TEMP/frontend-authority/Frontend/antigal.client"
          set +e
          (
            cd "$frontend"
            CI=true npm test -- --watchAll=false
          ) > b0-frontend-tests.txt 2>&1
          code=$?
          set -e
          echo "frontend_test_exit=$code" | tee b0-frontend-test-status.txt
          grep -E "No tests found|Tests:|Test Suites:" b0-frontend-tests.txt || true

      - name: Restore backend solution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet restore Backend/antigal.server.sln > b0-backend-restore.txt 2>&1
          code=$?
          set -e
          echo "backend_restore_exit=$code" | tee b0-backend-restore-status.txt

      - name: Build backend solution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet build Backend/antigal.server.sln -c Release --no-restore > b0-backend-build.txt 2>&1
          code=$?
          set -e
          echo "backend_build_exit=$code" | tee b0-backend-build-status.txt

      - name: Probe backend tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet test Backend/antigal.server.sln -c Release --no-build > b0-backend-tests.txt 2>&1
          code=$?
          set -e
          echo "backend_test_exit=$code" | tee b0-backend-test-status.txt
          grep -E "Test run|Total tests|Passed!|Failed!|No test" b0-backend-tests.txt || true

      - name: Inventory source and test surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee b0-source-inventory.txt
          from pathlib import Path

          frontend = [
              p for p in Path("Frontend/antigal.client/src").rglob("*")
              if p.is_file()
          ]
          backend = [
              p for p in Path("Backend").rglob("*")
              if p.is_file() and "bin" not in p.parts and "obj" not in p.parts
          ]
          controllers = [
              p for p in Path("Backend/antigal.server/Controllers").glob("*.cs")
              if p.is_file()
          ]
          migrations = [
              p for p in Path("Backend/antigal.server/Migrations").glob("*.cs")
              if p.is_file()
          ]
          tests = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and any(token in p.name.lower() for token in ("test", "tests", "spec"))
              and "node_modules" not in p.parts
          ]

          print(f"frontend_src_files={len(frontend)}")
          print(f"backend_source_files={len(backend)}")
          print(f"backend_controllers={len(controllers)}")
          print(f"backend_migration_files={len(migrations)}")
          print(f"repository_test_named_files={len(tests)}")
          PY

      - name: Inventory NuGet vulnerability baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet list Backend/antigal.server/antigal.server.csproj package --vulnerable --include-transitive > b0-nuget-vulnerable.txt 2>&1
          code=$?
          set -e
          echo "nuget_vulnerable_exit=$code" | tee b0-nuget-vulnerable-status.txt
          grep -E "has the following vulnerable packages|Top-level Package|Transitive Package|Critical|High|Moderate|Low|no vulnerable" b0-nuget-vulnerable.txt || true

      - name: Verify discovery is read-only
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee b0-git-status.txt
          git diff --exit-code

      - name: Write B0 summary
        if: always()
        shell: bash
        run: |
          {
            echo "# B0 collaborative discovery"
            echo "- candidate SHA: $GITHUB_SHA"
            echo "- backend compatibility target: .NET 8 from csproj"
            echo "- frontend compatibility probe: Node 20 (not historical authority)"
            echo "- integrated package.json/package-lock.json are expected malformed baseline"
            echo "- historical FrontEnd authority: 00692d5492dc21df8e3e86054d41bb980fc14564"
            echo
            cat b0-current-frontend-authority.txt 2>/dev/null || true
            cat b0-frontend-authority.txt 2>/dev/null || true
            cat b0-frontend-build-status.txt 2>/dev/null || true
            cat b0-frontend-audit-summary.txt 2>/dev/null || true
            cat b0-frontend-test-status.txt 2>/dev/null || true
            cat b0-backend-restore-status.txt 2>/dev/null || true
            cat b0-backend-build-status.txt 2>/dev/null || true
            cat b0-backend-test-status.txt 2>/dev/null || true
            cat b0-source-inventory.txt 2>/dev/null || true
            cat b0-nuget-vulnerable-status.txt 2>/dev/null || true
          } | tee b0-summary.md
          cat b0-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload B0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b0-discovery-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            b0-*.txt
            b0-*.md
